# Network settings for HikRobot GigE cameras, as in openUC2 OS (os-rpi:
# deployments/imswitch.pkg, feature hikrobot-cameras). Installed by docker/rpi-host-setup.sh.

# From the MVS package's set_rp_filter.sh
net.ipv4.conf.default.rp_filter = 0

# From the MVS package's set_socket_buffer_size.sh
net.core.rmem_max = 10485760
net.core.wmem_max = 10485760
