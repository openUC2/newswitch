# USB buffer memory for USB3 Vision cameras, written at every boot: the value the HikRobot MVS
# 5.1.1 package sets (set_usbfs_memory_size.sh; the kernel default of 16 MB is too small for
# fast cameras). Installed to /etc/tmpfiles.d/ by docker/rpi-host-setup.sh.
w /sys/module/usbcore/parameters/usbfs_memory_mb - - - - 2000
