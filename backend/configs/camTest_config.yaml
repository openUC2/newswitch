# Test configuration: one simulated camera through uc2_cam_py (no hardware needed).
#
# The camera manager is only used on real hardware, so start the backend with
#   NEWSWITCH_CONFIG=configs/camTest.json
# (needs the extra "camera": uv sync --extra camera). Stage and illumination then look for
# a UC2 board and keep retrying without one; the camera works regardless.
#
# The "camera" is a USB3 camera of the vendor "Simulated": uc2_cam_py simulates it (a
# Gaussian spot walking over the sensor). Recordings go to camera_recording_dir of
# base_config.yaml; with camera_debug_window there a window shows the image. Walkthrough:
# "End-to-end test for camera" in the repository's README.md.

newswitch_version: v1.0.2
devices:

  sim-camera-controller:
    type: controller
    name: Simulated-USB3-Camera-Controller
    connection:
      protocol: usb3-vision
    mapping:
      sim-cam:
        type: usb3-vision-camera
        id: 0
        buffer_size: 8
        # true records every image to camera_recording_dir; with camera_debug_window the
        # camera acquires all the time (about 12 MB/s here)
        store_image_data: false
        # passed to uc2_cam_py unchanged; options of its simulated camera
        vendor_options:
          sensor_width: 640
          sensor_height: 480
          frame_rate: 20.0

  sim-cam:
    type: detector
    name: UC2-SIM
    manufacturer: Simulated
    tags:
      - monochrome
      - simulated
    pixelcount: [640, 480]
    pixelpitch_um: 5.86
    channels: 1
    exposure_time_ms:
      value: 10.0
      min: 0.01
      max: 1000.0
      unit: ms
    framerate_per_sec:
      value: 20.0
      min: 0.1
      max: 200.0
      unit: Hz
    gain_db:
      value: 0.0
      min: 0.0
      max: 24.0
      unit: dB
    binning: 1

# --- UI ---
# The bloks the frontend shows (blok language v2), checked against the module it
# publishes (newswitch/bloks/newswitch-catalog.json); `catalog` names the version
# they were written against. One camera and nothing else: no stage, so no stage view and no
# calibration (its actions are not registered without a stage).
ui:
  catalog: newswitch@2
  bloks:
    view-camera:
      description: 'Camera: the live image of the camera, and acquiring it.'
      default: true
      bsx: |
        <Html>
        <div className="flex h-full flex-col gap-3 p-4">
            <div className="flex gap-2 past:hidden">
                <Button icon="play" onClick={self.start_live_view()}>Start live view</Button>
                <Button icon="square" variant="outline" onClick={self.stop_live_view()}>Stop</Button>
                <Button icon="camera" onClick={self.capture_image()}>Acquire</Button>
            </div>
            <div className="min-h-0 flex-1 overflow-hidden rounded-lg past:opacity-40">
                <LiveView className="h-full" />
            </div>
        </div>
        </Html>

# --- AGENT UI ---
# What Orkestrator shows in agent mode (python main_arkitekt.py): bloks drawn with the
# spec's catalogs and Orkestrator's module (`catalog` names the release), the cameras
# as lovekit streams.
agent_ui:
  catalog: orkestrator@v4.2.1
  bloks:
    view-microscope:
      description: 'Microscope: the camera streams, live view and acquiring.'
      default: true
      bsx: |
        <Html>
        <div className="flex flex-col gap-4 p-4">
            <Card>
                <CardHeader><CardTitle>Cameras</CardTitle></CardHeader>
                <CardContent>
                    <foreach items={self.CameraStreams.streams} let="stream">
                        <StructureDisplay value={stream} />
                    </foreach>
                </CardContent>
            </Card>
            <div className="flex gap-2">
                <Button icon="play" onClick={self.start_live_view()}>Start live view</Button>
                <Button icon="square" onClick={self.stop_live_view()}>Stop</Button>
                <Button icon="camera" onClick={self.capture_image()}>Acquire</Button>
            </div>
        </div>
        </Html>
