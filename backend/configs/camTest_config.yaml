# Test configuration: two cameras through uc2_cam_py, no UC2 board needed.
#
# The camera manager is only used on real hardware, so start the backend with
#   NEWSWITCH_MODE=hardware NEWSWITCH_CONFIG=configs/camTest_config.yaml
# (needs the extra "camera": uv sync --extra camera). Stage and illumination then look for
# a UC2 board and keep retrying without one; the cameras work regardless.
#
# Slot 1, "sim-cam": a USB3 camera of the vendor "Simulated", always available: uc2_cam_py
# simulates it (a Gaussian spot walking over the sensor).
# Slot 2, "hik-cam": the first HikRobot USB3 camera found. It needs uc2_cam_py built against
# the MVS SDK (MVS_ROOT, /opt/MVS) and a connected camera; without either it is skipped with
# a warning ("camera 'hik-cam' skipped: ...") and the simulated camera runs alone. To pin
# one camera, add e.g. serial_number: "00DA7175291" to its mapping entry.
#
# Recordings go to camera_recording_dir of base_config.yaml; with camera_debug_window there
# every camera shows its image in a window. Walkthrough: "End-to-end test for camera" in the
# repository's README.md.

newswitch_version: v1.0.2
devices:

  sim-camera-controller:
    type: controller
    name: Simulated-USB3-Camera-Controller
    connection:
      protocol: usb3-vision
    mapping:
      sim-cam:
        type: usb3-vision-camera
        id: 0
        buffer_size: 8
        # writing to camera_recording_dir is switched by the actions
        # start_live_view_and_save_to_disk / capture_image_and_save_to_disk (about 12 MB/s here)
        # passed to uc2_cam_py unchanged; options of its simulated camera
        vendor_options:
          sensor_width: 640
          sensor_height: 480
          frame_rate: 20.0

  sim-cam:
    type: detector
    name: UC2-SIM
    manufacturer: Simulated
    tags:
      - monochrome
      - simulated
    pixelcount: [640, 480]
    pixelpitch_um: 5.86
    channels: 1
    exposure_time_ms:
      value: 10.0
      min: 0.01
      max: 1000.0
      unit: ms
    framerate_per_sec:
      value: 20.0
      min: 0.1
      max: 200.0
      unit: Hz
    gain_db:
      value: 0.0
      min: 0.0
      max: 24.0
      unit: dB
    binning: 1

  hik-camera-controller:
    type: controller
    name: HikRobot-USB3-Camera-Controller
    connection:
      protocol: usb3-vision
    mapping:
      hik-cam:
        type: usb3-vision-camera
        id: 0
        buffer_size: 8
        # no serial_number / index: the first HikRobot USB3 camera found is opened

  hik-cam:
    type: detector
    name: MV-CA023-10UM
    # vendor as the camera library (uc2_cam_py) names it; case does not matter
    manufacturer: HikRobot
    tags:
      - monochrome
      - global-shutter
      - usb3
    pixelcount: [1920, 1200]
    pixelpitch_um: 5.86
    channels: 1
    exposure_time_ms:
      value: 10.0
      min: 0.024
      max: 10000.0
      unit: ms
    framerate_per_sec:
      value: 30.0
      min: 0.5
      max: 163.0
      unit: Hz
    gain_db:
      value: 0.0
      min: 0.0
      max: 23.98
      unit: dB
    binning: 1
