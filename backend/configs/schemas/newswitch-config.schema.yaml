# JSON Schema (Draft 2020-12) for newswitch-config.yaml.
# Generated from newswitch.config_io.devices -- do not edit by hand.
# Regenerate with: uv run python -m newswitch.config_io --export-schema

$schema: https://json-schema.org/draft/2020-12/schema
$defs:
  AxisConfig:
    description: One motorized axis; a stage names it under a direction.
    properties:
      name:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Display name; defaults to the key
        title: Name
      tags:
        description: Free-form labels
        items:
          type: string
        title: Tags
        type: array
      inverted:
        default: false
        description: Axis runs in the opposite direction
        title: Inverted
        type: boolean
      manufacturer:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Vendor name
        title: Manufacturer
        x_firmware: full
      type:
        const: axis
        default: axis
        title: Type
        type: string
      steps_per_um:
        anyOf:
        - exclusiveMinimum: 0
          type: number
        - type: 'null'
        description: Motor steps per um; null for a servo axis
        title: Steps Per Um
        x_firmware: full
      homing_required:
        default: false
        description: Axis must be homed before use
        title: Homing Required
        type: boolean
        x_firmware: full
      pos:
        anyOf:
        - $ref: '#/$defs/PhysVal'
        - type: 'null'
        default: null
        description: Position; min/max give the travel, named presets the wheel slots
        x_firmware: full
        x_unit: um
      vel:
        anyOf:
        - $ref: '#/$defs/PhysVal'
        - type: 'null'
        default: null
        description: Velocity
        x_firmware: full
        x_unit: um/s
      acc:
        anyOf:
        - $ref: '#/$defs/PhysVal'
        - type: 'null'
        default: null
        description: Acceleration
        x_firmware: full
        x_unit: um/s**2
      jerk:
        anyOf:
        - $ref: '#/$defs/PhysVal'
        - type: 'null'
        default: null
        description: Jerk
        x_firmware: full
        x_unit: um/s**3
    required:
    - type
    - steps_per_um
    title: AxisConfig
    type: object
  BlokEntry:
    additionalProperties: false
    description: 'A blok of the ``ui`` section: its BSX source, exactly as the frontend gets it.'
    properties:
      bsx:
        description: The blok's tree as BSX source
        title: Bsx
        type: string
      description:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Shown in the bottom bar; a view's starts with its tab label
        title: Description
      default:
        type: boolean
        default: false
        description: The blok shown first
        title: Default
      context:
        default: html
        description: Where the blok renders
        title: Context
        type: string
    required:
    - bsx
    title: BlokEntry
    type: object
  CanOpenProtocol:
    additionalProperties: false
    description: CANopen bus; each mapped device names its node with ``id`` (and ``subid``).
    properties:
      protocol:
        const: canopen
        default: canopen
        title: Protocol
        type: string
      eds_file:
        anyOf:
        - format: path
          type: string
        - type: 'null'
        default: null
        title: Eds File
      sdo_timeout:
        default: 0.5
        title: Sdo Timeout
        type: number
      heartbeat_period_ms:
        anyOf:
        - type: integer
        - type: 'null'
        default: null
        title: Heartbeat Period Ms
      transport:
        $ref: '#/$defs/CanTransport'
    required:
    - transport
    title: CanOpenProtocol
    type: object
  CanTransport:
    additionalProperties: false
    description: CAN bus interface (based on python-can).
    properties:
      type:
        const: can
        default: can
        title: Type
        type: string
      interface:
        default: socketcan
        enum:
        - socketcan
        - waveshare
        - pcan
        - kvaser
        - slcan
        - gs_usb
        - virtual
        title: Interface
        type: string
      channel:
        default: can0
        title: Channel
        type: string
      port:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Port
      bitrate:
        default: 500000
        title: Bitrate
        type: integer
    title: CanTransport
    type: object
  ControllerConfig:
    description: 'Controller board (e.g. UC2 mainboard): the only device with a connection.'
    properties:
      name:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Display name; defaults to the key
        title: Name
      tags:
        description: Free-form labels
        items:
          type: string
        title: Tags
        type: array
      connection:
        description: How the controller is reached
        discriminator:
          mapping:
            canopen: '#/$defs/CanOpenProtocol'
            gige-vision: '#/$defs/GigEVisionProtocol'
            modbus: '#/$defs/ModbusProtocol'
            register-map: '#/$defs/RegisterMapProtocol'
            simulated: '#/$defs/SimulatedProtocol'
            uc2-rest: '#/$defs/Uc2RestProtocol'
            usb3-vision: '#/$defs/Usb3VisionProtocol'
          propertyName: protocol
        oneOf:
        - $ref: '#/$defs/Uc2RestProtocol'
        - $ref: '#/$defs/CanOpenProtocol'
        - $ref: '#/$defs/ModbusProtocol'
        - $ref: '#/$defs/RegisterMapProtocol'
        - $ref: '#/$defs/GigEVisionProtocol'
        - $ref: '#/$defs/Usb3VisionProtocol'
        - $ref: '#/$defs/SimulatedProtocol'
        title: Connection
      firmware:
        $ref: '#/$defs/Firmware'
        description: Firmware running on the controller
      mapping:
        additionalProperties:
          $ref: '#/$defs/MappingEntry'
        description: Key of a device in this file -> its address on this controller
        title: Mapping
        type: object
      manufacturer:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Vendor name
        title: Manufacturer
        x_firmware: full
      type:
        const: controller
        default: controller
        title: Type
        type: string
    required:
    - type
    - connection
    - mapping
    title: ControllerConfig
    type: object
  DetectorConfig:
    description: Camera or single-diode detector.
    properties:
      name:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Display name; defaults to the key
        title: Name
      tags:
        description: Free-form labels
        items:
          type: string
        title: Tags
        type: array
      manufacturer:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Vendor name
        title: Manufacturer
        x_firmware: full
      type:
        const: detector
        default: detector
        title: Type
        type: string
      pixelcount:
        anyOf:
        - maxItems: 2
          minItems: 2
          prefixItems:
          - exclusiveMinimum: 0
            type: integer
          - exclusiveMinimum: 0
            type: integer
          type: array
        - type: 'null'
        default: null
        description: Sensor resolution [x, y]
        title: Pixelcount
        x_firmware: full
      pixelpitch_um:
        anyOf:
        - exclusiveMinimum: 0
          type: number
        - maxItems: 2
          minItems: 2
          prefixItems:
          - exclusiveMinimum: 0
            type: number
          - exclusiveMinimum: 0
            type: number
          type: array
        - type: 'null'
        default: null
        description: Center-to-center pixel distance in um
        title: Pixelpitch Um
        x_firmware: full
      pixelsize_um:
        anyOf:
        - exclusiveMinimum: 0
          type: number
        - maxItems: 2
          minItems: 2
          prefixItems:
          - exclusiveMinimum: 0
            type: number
          - exclusiveMinimum: 0
            type: number
          type: array
        - type: 'null'
        default: null
        description: Photosensitive width per pixel in um; <= pitch
        title: Pixelsize Um
        x_firmware: full
      channels:
        default: 1
        description: Number of color/spectral channels
        exclusiveMinimum: 0
        title: Channels
        type: integer
        x_firmware: full
      exposure_time_ms:
        anyOf:
        - $ref: '#/$defs/PhysVal'
        - type: 'null'
        default: null
        description: Integration time
        x_firmware: limits
        x_unit: ms
      framerate_per_sec:
        anyOf:
        - $ref: '#/$defs/PhysVal'
        - type: 'null'
        default: null
        description: Frame rate
        x_firmware: limits
        x_unit: Hz
      gain_db:
        anyOf:
        - $ref: '#/$defs/PhysVal'
        - type: 'null'
        default: null
        description: Analog gain
        x_firmware: limits
        x_unit: dB
      binning:
        default: 1
        description: Symmetric hardware binning
        enum:
        - 1
        - 2
        - 4
        title: Binning
        type: integer
        x_firmware: full
      trigger:
        anyOf:
        - $ref: '#/$defs/Trigger'
        - type: 'null'
        default: null
    title: DetectorConfig
    type: object
    required:
    - type
  FilterConfig:
    description: Optical filter (passive; may sit in a wheel).
    properties:
      name:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Display name; defaults to the key
        title: Name
      tags:
        description: Free-form labels
        items:
          type: string
        title: Tags
        type: array
      wavelength:
        anyOf:
        - exclusiveMinimum: 0
          type: number
        - type: 'null'
        default: null
        description: Center wavelength in nm
        title: Wavelength
      bandwidth:
        anyOf:
        - exclusiveMinimum: 0
          type: number
        - type: 'null'
        default: null
        description: Bandwidth in nm
        title: Bandwidth
      spec_shape:
        anyOf:
        - enum:
          - gauss
          - tophat
          type: string
        - type: 'null'
        default: null
        description: Spectral shape
        title: Spec Shape
      transmission:
        default: 1.0
        description: Peak transmission
        maximum: 1.0
        minimum: 0.0
        title: Transmission
        type: number
      manufacturer:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Vendor name
        title: Manufacturer
        x_firmware: full
      type:
        const: filter
        default: filter
        title: Type
        type: string
    title: FilterConfig
    type: object
    required:
    - type
  Firmware:
    additionalProperties: false
    description: Firmware running on a controller; None means not stated.
    properties:
      name:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Name
      version:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Version
    title: Firmware
    type: object
  GigEVisionProtocol:
    additionalProperties: false
    description: GigE Vision camera; the transport is managed by the camera SDK.
    properties:
      protocol:
        const: gige-vision
        default: gige-vision
        title: Protocol
        type: string
      serial_number:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Serial Number
      ip:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Ip
      mac:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Mac
      user_defined_name:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: User Defined Name
      packet_size:
        anyOf:
        - type: integer
        - type: 'null'
        default: null
        title: Packet Size
    title: GigEVisionProtocol
    type: object
  HttpTransport:
    additionalProperties: false
    description: HTTP(S) connection, e.g. uc2-rest over Wi-Fi/Ethernet.
    properties:
      type:
        const: http
        default: http
        title: Type
        type: string
      host:
        title: Host
        type: string
      port:
        anyOf:
        - type: integer
        - type: 'null'
        default: null
        title: Port
      scheme:
        default: http
        enum:
        - http
        - https
        title: Scheme
        type: string
      base_path:
        default: ''
        title: Base Path
        type: string
      timeout:
        default: 5.0
        title: Timeout
        type: number
      verify_ssl:
        default: true
        title: Verify Ssl
        type: boolean
      token:
        anyOf:
        - format: password
          type: string
          writeOnly: true
        - type: 'null'
        default: null
        title: Token
      ws_path:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Ws Path
    required:
    - host
    title: HttpTransport
    type: object
  I2cTransport:
    additionalProperties: false
    description: "I2C bus + slave address (the address is part of the I2C link layer).\n\nBus speed is not configurable from user space on Linux; on a Raspberry Pi\nit is set in config.txt (dtparam=i2c_arm_baudrate=...)."
    properties:
      type:
        const: i2c
        default: i2c
        title: Type
        type: string
      bus:
        default: 1
        title: Bus
        type: integer
      address:
        maximum: 1023
        minimum: 0
        title: Address
        type: integer
      ten_bit:
        default: false
        title: Ten Bit
        type: boolean
      force:
        default: false
        title: Force
        type: boolean
    required:
    - address
    title: I2cTransport
    type: object
  LightsourceConfig:
    description: Illumination source (LED, laser, ...).
    properties:
      name:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Display name; defaults to the key
        title: Name
      tags:
        description: Free-form labels
        items:
          type: string
        title: Tags
        type: array
      wavelength:
        anyOf:
        - exclusiveMinimum: 0
          type: number
        - type: 'null'
        default: null
        description: Wavelength in nm
        title: Wavelength
      bandwidth:
        anyOf:
        - exclusiveMinimum: 0
          type: number
        - type: 'null'
        default: null
        description: Bandwidth in nm
        title: Bandwidth
      spec_shape:
        anyOf:
        - enum:
          - gauss
          - tophat
          type: string
        - type: 'null'
        default: null
        description: Spectral shape
        title: Spec Shape
      pulse_length:
        anyOf:
        - exclusiveMinimum: 0
          type: number
        - type: 'null'
        default: null
        description: Pulse length; null = continuous wave
        title: Pulse Length
      pulse_length_unit:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Unit of pulse_length; ignored without pulse_length
        title: Pulse Length Unit
      manufacturer:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Vendor name
        title: Manufacturer
        x_firmware: full
      type:
        const: lightsource
        default: lightsource
        title: Type
        type: string
      channels:
        default: 1
        description: Number of color/spectral channels
        exclusiveMinimum: 0
        title: Channels
        type: integer
        x_firmware: full
      coherence:
        default: incoherent
        enum:
        - coherent
        - incoherent
        - partial
        title: Coherence
        type: string
      polarization:
        default: random
        enum:
        - s
        - p
        - random
        title: Polarization
        type: string
      trigger:
        anyOf:
        - $ref: '#/$defs/Trigger'
        - type: 'null'
        default: null
    title: LightsourceConfig
    type: object
    required:
    - type
  MappingEntry:
    description: Address of one device on its controller.
    properties:
      type:
        description: Kind of link on the controller, e.g. canopen-motor
        title: Type
        type: string
      id:
        description: CAN node id, or the id in the UC2-REST nomenclature
        minimum: 0
        title: Id
        type: integer
      subid:
        default: 0
        description: Sub-address below id (CAN sub id)
        minimum: 0
        title: Subid
        type: integer
      pwm_max:
        anyOf:
        - exclusiveMinimum: 0
          type: integer
        - type: 'null'
        default: null
        description: Largest PWM value; required for PWM outputs, else null
        title: Pwm Max
    required:
    - type
    - id
    title: MappingEntry
    type: object
  ModbusProtocol:
    additionalProperties: false
    description: Modbus RTU/ASCII on serial lines (typically RS485 multidrop) or Modbus TCP.
    properties:
      protocol:
        const: modbus
        default: modbus
        title: Protocol
        type: string
      unit_id:
        maximum: 255
        minimum: 0
        title: Unit Id
        type: integer
      framing:
        anyOf:
        - enum:
          - rtu
          - ascii
          - mbap
          type: string
        - type: 'null'
        default: null
        title: Framing
      response_timeout:
        default: 0.5
        title: Response Timeout
        type: number
      retries:
        default: 2
        title: Retries
        type: integer
      transport:
        discriminator:
          mapping:
            rs422: '#/$defs/Rs422Transport'
            rs485: '#/$defs/Rs485Transport'
            serial: '#/$defs/SerialTransport'
            tcp: '#/$defs/TcpTransport'
          propertyName: type
        oneOf:
        - $ref: '#/$defs/Rs485Transport'
        - $ref: '#/$defs/Rs422Transport'
        - $ref: '#/$defs/SerialTransport'
        - $ref: '#/$defs/TcpTransport'
        title: Transport
    required:
    - unit_id
    - transport
    title: ModbusProtocol
    type: object
  ObjectiveConfig:
    description: Objective lens (passive; may sit in a wheel).
    properties:
      name:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Display name; defaults to the key
        title: Name
      tags:
        description: Free-form labels
        items:
          type: string
        title: Tags
        type: array
      magnification:
        description: Magnification
        exclusiveMinimum: 0
        title: Magnification
        type: number
      na:
        description: Numerical aperture
        exclusiveMinimum: 0
        title: Na
        type: number
      wd:
        description: Working distance in mm
        exclusiveMinimum: 0
        title: Wd
        type: number
      manufacturer:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Vendor name
        title: Manufacturer
        x_firmware: full
      type:
        const: objective
        default: objective
        title: Type
        type: string
    required:
    - type
    - magnification
    - na
    - wd
    title: ObjectiveConfig
    type: object
  PhysVal:
    anyOf:
    - description: 'Shorthand for {value: <number>}'
      type: number
    - additionalProperties: false
      description: "A physical value with its device limits.\n\nOnly ``value`` and ``selected_index`` may be changed by the software at runtime; they\nare written back to the file on shutdown. The other members describe what the device\nallows."
      properties:
        inc:
          default: 2.220446049250313e-16
          description: Step size
          exclusiveMinimum: 0
          title: Inc
          type: number
        preset_vals:
          anyOf:
          - items:
              type: number
            type: array
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          default: null
          description: Preset values, as a list or as value -> name
          title: Preset Vals
        selected_index:
          anyOf:
          - minimum: 0
            type: integer
          - type: 'null'
          default: null
          description: Selected preset (0-based index into preset_vals)
          title: Selected Index
        value:
          anyOf:
          - type: number
          - type: 'null'
          default: null
          title: Value
        min:
          default: -.inf
          title: Min
          type: number
        max:
          default: .inf
          title: Max
          type: number
        unit:
          default: ''
          title: Unit
          type: string
      title: PhysVal
      type: object
    description: Physical value with its device limits
  RegisterMapProtocol:
    additionalProperties: false
    description: Register read/write devices (sensors, DACs, IO expanders, ...).
    properties:
      protocol:
        const: register-map
        default: register-map
        title: Protocol
        type: string
      register_width:
        default: 8
        enum:
        - 8
        - 16
        title: Register Width
        type: integer
      byte_order:
        default: big
        enum:
        - big
        - little
        title: Byte Order
        type: string
      register_file:
        anyOf:
        - format: path
          type: string
        - type: 'null'
        default: null
        title: Register File
      retries:
        default: 2
        title: Retries
        type: integer
      transport:
        $ref: '#/$defs/I2cTransport'
    required:
    - transport
    title: RegisterMapProtocol
    type: object
  Rs422Transport:
    additionalProperties: false
    description: "Differential, full-duplex UART via an RS422 adapter.\n\nSame line settings as serial, but no DTR/RTS-based MCU reset:\nthose lines are not wired to the target on an RS422 link."
    properties:
      port:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Port
      port_pattern:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Port Pattern
      vid:
        anyOf:
        - type: integer
        - type: 'null'
        default: null
        title: Vid
      pid:
        anyOf:
        - type: integer
        - type: 'null'
        default: null
        title: Pid
      serial_number:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Serial Number
      baudrate:
        default: 115200
        title: Baudrate
        type: integer
      bytesize:
        default: 8
        enum:
        - 5
        - 6
        - 7
        - 8
        title: Bytesize
        type: integer
      parity:
        default: N
        enum:
        - N
        - E
        - O
        - M
        - S
        title: Parity
        type: string
      stopbits:
        default: 1
        enum:
        - 1
        - 1.5
        - 2
        title: Stopbits
        type: number
      timeout:
        default: 1.0
        title: Timeout
        type: number
      write_timeout:
        anyOf:
        - type: number
        - type: 'null'
        default: 1.0
        title: Write Timeout
      rtscts:
        default: false
        title: Rtscts
        type: boolean
      type:
        const: rs422
        default: rs422
        title: Type
        type: string
    title: Rs422Transport
    type: object
  Rs485Transport:
    additionalProperties: false
    description: "Differential, half-duplex, multidrop UART via an RS485 adapter.\n\nHalf duplex means the driver direction must be switched between\ntransmit and receive:\n  auto     -> the adapter switches by itself (most USB-RS485 adapters)\n  kernel   -> Linux driver toggles RTS (TIOCSRS485, e.g. UART + transceiver on a Pi)\n  software -> pyserial toggles RTS from Python (timing not guaranteed)"
    properties:
      port:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Port
      port_pattern:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Port Pattern
      vid:
        anyOf:
        - type: integer
        - type: 'null'
        default: null
        title: Vid
      pid:
        anyOf:
        - type: integer
        - type: 'null'
        default: null
        title: Pid
      serial_number:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Serial Number
      baudrate:
        default: 115200
        title: Baudrate
        type: integer
      bytesize:
        default: 8
        enum:
        - 5
        - 6
        - 7
        - 8
        title: Bytesize
        type: integer
      parity:
        default: N
        enum:
        - N
        - E
        - O
        - M
        - S
        title: Parity
        type: string
      stopbits:
        default: 1
        enum:
        - 1
        - 1.5
        - 2
        title: Stopbits
        type: number
      timeout:
        default: 1.0
        title: Timeout
        type: number
      write_timeout:
        anyOf:
        - type: number
        - type: 'null'
        default: 1.0
        title: Write Timeout
      rtscts:
        default: false
        title: Rtscts
        type: boolean
      type:
        const: rs485
        default: rs485
        title: Type
        type: string
      direction_control:
        default: auto
        enum:
        - auto
        - kernel
        - software
        title: Direction Control
        type: string
      rts_level_for_tx:
        default: true
        title: Rts Level For Tx
        type: boolean
      rts_level_for_rx:
        default: false
        title: Rts Level For Rx
        type: boolean
      delay_before_tx:
        anyOf:
        - type: number
        - type: 'null'
        default: null
        title: Delay Before Tx
      delay_before_rx:
        anyOf:
        - type: number
        - type: 'null'
        default: null
        title: Delay Before Rx
      echo:
        default: false
        title: Echo
        type: boolean
    title: Rs485Transport
    type: object
  SerialTransport:
    additionalProperties: false
    description: USB-UART / RS232 / TTL, e.g. a directly attached ESP32.
    properties:
      port:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Port
      port_pattern:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Port Pattern
      vid:
        anyOf:
        - type: integer
        - type: 'null'
        default: null
        title: Vid
      pid:
        anyOf:
        - type: integer
        - type: 'null'
        default: null
        title: Pid
      serial_number:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Serial Number
      baudrate:
        default: 115200
        title: Baudrate
        type: integer
      bytesize:
        default: 8
        enum:
        - 5
        - 6
        - 7
        - 8
        title: Bytesize
        type: integer
      parity:
        default: N
        enum:
        - N
        - E
        - O
        - M
        - S
        title: Parity
        type: string
      stopbits:
        default: 1
        enum:
        - 1
        - 1.5
        - 2
        title: Stopbits
        type: number
      timeout:
        default: 1.0
        title: Timeout
        type: number
      write_timeout:
        anyOf:
        - type: number
        - type: 'null'
        default: 1.0
        title: Write Timeout
      rtscts:
        default: false
        title: Rtscts
        type: boolean
      type:
        const: serial
        default: serial
        title: Type
        type: string
      reset_on_connect:
        default: false
        title: Reset On Connect
        type: boolean
      boot_delay:
        default: 0.0
        title: Boot Delay
        type: number
    title: SerialTransport
    type: object
  SimulatedProtocol:
    additionalProperties: false
    description: 'Simulated controller: validates like a real one but opens no hardware.'
    properties:
      protocol:
        const: simulated
        default: simulated
        title: Protocol
        type: string
      transport:
        $ref: '#/$defs/SimulatedTransport'
    required:
    - transport
    title: SimulatedProtocol
    type: object
  SimulatedTransport:
    additionalProperties: false
    description: 'No physical link: the controller and the devices behind it are simulated.'
    properties:
      type:
        const: simulated
        default: simulated
        title: Type
        type: string
    title: SimulatedTransport
    type: object
  StageConfig:
    description: 'Motorized stage: axis devices grouped by direction.'
    properties:
      name:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Display name; defaults to the key
        title: Name
      tags:
        description: Free-form labels
        items:
          type: string
        title: Tags
        type: array
      axes:
        additionalProperties:
          type: string
        description: Direction (e.g. x) -> key of an axis device
        minProperties: 1
        title: Axes
        type: object
      homing_order:
        anyOf:
        - items:
            type: string
          type: array
        - type: 'null'
        default: null
        description: Directions in homing order; null = home all in parallel
        title: Homing Order
      manufacturer:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Vendor name
        title: Manufacturer
        x_firmware: full
      type:
        const: stage
        default: stage
        title: Type
        type: string
    required:
    - type
    - axes
    title: StageConfig
    type: object
  TcpTransport:
    additionalProperties: false
    description: Raw TCP socket.
    properties:
      type:
        const: tcp
        default: tcp
        title: Type
        type: string
      host:
        title: Host
        type: string
      port:
        maximum: 65535
        minimum: 1
        title: Port
        type: integer
      timeout:
        default: 5.0
        title: Timeout
        type: number
      terminator:
        default: "\n"
        title: Terminator
        type: string
      keepalive:
        default: true
        title: Keepalive
        type: boolean
    required:
    - host
    - port
    title: TcpTransport
    type: object
  Trigger:
    additionalProperties: false
    description: Trigger of a device. Omit it for free-running operation.
    properties:
      type:
        enum:
        - software
        - hardware
        title: Type
        type: string
      edge:
        anyOf:
        - enum:
          - rising
          - falling
          type: string
        - type: 'null'
        default: null
        title: Edge
      level:
        anyOf:
        - type: number
        - type: 'null'
        default: null
        title: Level
    required:
    - type
    title: Trigger
    type: object
  Uc2RestProtocol:
    additionalProperties: false
    description: JSON command protocol of openUC2 controllers (ESP32 firmware).
    properties:
      protocol:
        const: uc2-rest
        default: uc2-rest
        title: Protocol
        type: string
      response_timeout:
        default: 2.0
        title: Response Timeout
        type: number
      retries:
        default: 1
        title: Retries
        type: integer
      transport:
        discriminator:
          mapping:
            http: '#/$defs/HttpTransport'
            rs422: '#/$defs/Rs422Transport'
            serial: '#/$defs/SerialTransport'
            tcp: '#/$defs/TcpTransport'
          propertyName: type
        oneOf:
        - $ref: '#/$defs/SerialTransport'
        - $ref: '#/$defs/Rs422Transport'
        - $ref: '#/$defs/HttpTransport'
        - $ref: '#/$defs/TcpTransport'
        title: Transport
    required:
    - transport
    title: Uc2RestProtocol
    type: object
  UiConfig:
    additionalProperties: false
    description: 'A UI section (``ui``, ``agent_ui``): the bloks, and the catalog they are written against.'
    properties:
      catalog:
        description: The catalog the bloks were written against, as <name>@<version>
        pattern: ^[A-Za-z0-9_-]+@[A-Za-z0-9_.-]+$
        title: Catalog
        type: string
      bloks:
        additionalProperties:
          $ref: '#/$defs/BlokEntry'
        description: The bloks, keyed by name
        title: Bloks
        type: object
    required:
    - catalog
    - bloks
    title: UiConfig
    type: object
  Usb3VisionProtocol:
    additionalProperties: false
    description: USB3 Vision camera; the transport is managed by the camera SDK.
    properties:
      protocol:
        const: usb3-vision
        default: usb3-vision
        title: Protocol
        type: string
      serial_number:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Serial Number
      user_defined_name:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: User Defined Name
      index:
        anyOf:
        - type: integer
        - type: 'null'
        default: null
        title: Index
    title: Usb3VisionProtocol
    type: object
additionalProperties: false
description: Top level of ``newswitch-config.yaml``.
properties:
  newswitch_version:
    description: newswitch version the file was written for
    title: Newswitch Version
    type: string
  devices:
    additionalProperties:
      discriminator:
        mapping:
          axis: '#/$defs/AxisConfig'
          controller: '#/$defs/ControllerConfig'
          detector: '#/$defs/DetectorConfig'
          filter: '#/$defs/FilterConfig'
          lightsource: '#/$defs/LightsourceConfig'
          objective: '#/$defs/ObjectiveConfig'
          stage: '#/$defs/StageConfig'
        propertyName: type
      oneOf:
      - $ref: '#/$defs/LightsourceConfig'
      - $ref: '#/$defs/DetectorConfig'
      - $ref: '#/$defs/ControllerConfig'
      - $ref: '#/$defs/StageConfig'
      - $ref: '#/$defs/AxisConfig'
      - $ref: '#/$defs/ObjectiveConfig'
      - $ref: '#/$defs/FilterConfig'
    description: All devices, keyed by their identifier
    title: Devices
    type: object
  assets:
    additionalProperties:
      type: string
    description: Files the bloks read as @self.assets.<name>, relative to newswitch/
    title: Assets
    type: object
  ui:
    anyOf:
    - $ref: '#/$defs/UiConfig'
    - type: 'null'
    default: null
    description: The bloks the newswitch frontend shows (FastAPI mode), in its catalog
  agent_ui:
    anyOf:
    - $ref: '#/$defs/UiConfig'
    - type: 'null'
    default: null
    description: The bloks Orkestrator shows (agent mode), in its standard catalog
required:
- newswitch_version
- devices
title: NewswitchConfig
type: object
