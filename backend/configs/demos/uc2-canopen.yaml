# Reduced hardware configuration using controller mappings.
# Replace illustrative ports, addresses and calibration before physical use.
newswitch_version: v1.0.2
devices:
  my-hat-board-via-can:
    type: controller
    name: CAN_HAT
    manufacturer: someDude
    connection:
      protocol: canopen
      transport:
        type: can
        interface: socketcan
        channel: can0
        bitrate: 500000
    mapping:
      my-first-axis:
        type: canopen-motor
        id: 11
        subid: 0
      my-second-axis:
        type: canopen-motor
        id: 22
        subid: 0

      my-laser-serial:
        type: canopen-laser
        id: 21
        subid: 1
        pwm_max: 1023
      top-illumination-LED:
        type: canopen-laser
        id: 21
        subid: 0
        pwm_max: 1023
      led-matrix:
        type: canopen-led-matrix
        id: 20
  just-some-boring-stage:
    type: stage
    name: xyz-linear-100
    manufacturer: openUC2
    homing_order: [z, x]
    axes:
      x: my-first-axis
      z: my-second-axis

  my-first-axis:
    type: axis
    steps_per_um: 8.0
    homing_required: true
    pos: {min: 0.0, max: 100000.0, unit: um}
    vel: {value: 5000.0, unit: um/s}
    optikit_dsn_variable: sample-x

  my-second-axis:
    type: axis
    name: scanning-axis
    manufacturer: openUC2
    steps_per_um: 8.0
    pos: {min: 0.0, max: 100000.0, unit: um}
    vel: {value: 5000.0, unit: um/s}
    optikit_dsn_variable: sample-z

  my-laser-serial:
    type: lightsource
    name: boison-488
    manufacturer: Boison
    wavelength: 488
    bandwidth: 2.0
    spec_shape: gauss
    coherence: coherent

  top-illumination-LED:
    type: lightsource
    name: cool-led
    manufacturer: TheLEDCompany
    wavelength: 193
    bandwidth: 200
    spec_shape: gauss

  # RGB matrix, routed through its controller mapping.
  led-matrix:
    type: lightsource
    name: RGB LED matrix
    channels: 3
    coherence: incoherent

  # --- STAGES, AXES AND WHEELS ---
