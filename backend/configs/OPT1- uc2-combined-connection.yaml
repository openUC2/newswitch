# Sample on how to set up configs
# Main boards (controllers) should cover all current use cases (based on Benes diagram)
# id and subid used for identification of sub devices on the bus (CANopen, those manged by the Standalone board)
#   note: transfer of id into stepper_id or laser_id must be done by SW
# All conneciton information should be in the controller section, not in the sub devices (axes, lasers, stages, etc.)
# Wheels for filters and/or objectives are represented as stages with a single axis with preset pos values
#
# Open points are
#  - How to handle triggering
#  - Should we also set parameters that can and will be changed by the user (like exposure time, gain, pos, etc.) in the config? (currently only the boarders and units are set)


newswitch_version: v1.0.2
devices:

  # --- MAIN BOARDS ---
  my-standalone-board:
    type: controller
    name: UC2-Mainboard-v4
    manufacturer: openUC2
    connection:
      protocol: uc2-rest
      transport:
        type: serial
        port_pattern: /dev/ttyUSB*
        baudrate: 115200
    firmware:
      name: esp32-uc2-standalone-4
      version: v2026.0.0-beta.3
    mapping:
      my-laser-serial:
        type: serial-laser
        id: 2
        pwm_max: 1023
      my-laser-can:
        type: canopen-laser,
        id: 0
        subid: 1
        pwm_max: 1023
      my-first-axis:
        type: canopen-motor
        id: 0
        subid: 1

  my-hat-board-via-can:
    type: controller
    name: CAN_HAT
    manufacturer: someDude
    connection:
      protocol: can-bus
      transport:
        type: can
        interface: socketcan
        channel: can0
        bitrate: 500000
    mapping:
      top-illumination-LED:
        type: canopen-laser,
        id: 21,
        subid: 0,
        pwm_max: 1023
      my-filter-wheel:
        type: canopen-revolver,
        id: 4,
        channel: 1,
      my-second-axis:
        type: canopen-motor
        id: 21
        subid: 0

  my-hat-board-via-serial:
    type: controller
    name: ERIAL_HAT
    manufacturer: someDude
    connection:
      protocol: uc2-rest
      transport:
        type: serial
        port_pattern: /dev/ttyUSB*
        baudrate: 921600
    mapping:
      top-illumination-LED:
        type: canopen-laser,
        id: 21,
        subid: 0,
        pwm_max: 1023
      my-filter-wheel:
        type: canopen-stage,
        id: 4,
        channel: 1,
      my-second-axis:
        type: canopen-motor
        id: 21
        subid: 0

  my-usb3-camera-controll:
    type: controller
    name: USB3-Camera-Controller
    manufacturer: theRPIGuys
    connection:
      protocol: usb3-vision
    mapping:
      bigcamera42:
        type: usb3-vision-camera
        serial_number: 00F12345678
        index: 0

  my-gigE-camera-controll:
    type: controller
    name: GigE-Camera-Controller
    manufacturer: theRPIGuys
    connection:
      protocol: gige-vision
    mapping:
      bigcamera42:
        type: gige-vision-camera
        serial_number: abcd1234
        index: 0



  # --- LASERS AND LEDS---
  my-laser-serial:
    type: lightsource
    name: boison-488
    manufacturer: Boison
    wavelength: 488
    bandwidth: 2.0
    spec_shape: gauss
    coherence: coherent

  my-laser-can:
    type: lightsource
    name: jenoptik-1310
    manufacturer: Jenoptik
    wavelength: 1310
    bandwidth: 2.0
    spec_shape: gauss
    coherence: coherent

  top-illumination-LED:
    type: lightsource
    name: cool-led
    manufacturer: TheLEDCompany
    wavelength: 193
    bandwidth: 200
    spec_shape: gauss


 # --- STAGES, AXES AND WHEELS ---

  my-filter-wheel:
    type: stage
    name: filter-wheel-1
    manufacturer: openUC2


  my-filter-wheel-axis:
    type: axis
    steps_per_um: 8.0
    pos: {
      preset_vals: {0: "null", 1000: "flt-gfp", 2000: "flt-tritc"},
      selected_index: 0,
    }

  my-first-axis:
    type: axis
    steps_per_um: 8.0
    homing_required: true
    pos: {min: 0.0, max: 100000.0, unit: um}
    vel: {value: 5000.0, unit: um/s}
    optikit_dsn_variable: sample-x

  my-second-axis:
    type: axis
    name: scanning-axis
    manufacturer: openUC2
    steps_per_um: 8.0
    pos: {min: 0.0, max: 100000.0, unit: um}
    vel: {value: 5000.0, unit: um/s}
    optikit_dsn_variable: sample-z


  just-some-boring-stage:
    type: stage
    name: xyz-linear-100
    manufacturer: openUC2

    homing_order: [z, x]
    axes:
      x: my-first-axis
      z: my-second-axis

 # --- CAMERAS ---
  bigcamera42:
    type: detector
    name: MV-CA023-10UM
    manufacturer: HIK ROBOTICS
    tags:
      - monochrome
      - global-shutter
      - gige
    pixelcount: [1920, 1200]
    pixelpitch_um: 10.0
    channels: 1
    exposure_time_ms:
      value: 25.0
      min: 0.024
      max: 10000.0
      inc: 0.001
      unit: ms
    framerate_per_sec:
      value: 163.0
      min: 0.5
      max: 163.0
      unit: Hz
    gain_db:
      value: 0.0
      min: 0.0
      max: 23.98
      inc: 0.01
      unit: dB
    binning: 1
    trigger:
      type: hardware
      edge: rising


