                                <span className="text-xs text-muted-foreground">ms</span>
                            </div>
                            <Slider className="min-w-0 past:hidden" step={0.1} value={math.mul(a: camera.current_exposure_time, b: 1000)} min={math.mul(a: camera.min_exposure_time, b: 1000)} max={math.mul(a: camera.max_exposure_time, b: 1000)} onCommit={self.update_detector(slot: camera.slot, exposure_time: math.div(a: event.value, b: 1000))} />
