                        <span text="@utils.str.concat(values=[utils.fmt.number(value=utils.math.multiply(values=[camera.current_exposure_time, 1000]), maximumFractionDigits=1), ' ms at ', utils.fmt.percent(value=utils.math.divide(a=utils.obj.get(value=utils.list.first(value=self.IlluminationState.illuminations), path='intensity'), b=utils.obj.get(value=utils.list.first(value=self.IlluminationState.illuminations), path='max_intensity')))])" className="ml-auto text-xs font-medium tabular-nums text-amber-200" />
                    </div>
                    <span text="Longer and brighter collects more photons, and bleaches more." className="mt-2 block text-[11px] text-muted-foreground" />
                </div>
            </foreach>
        </div>
                </div>
            </ScrollArea>
            <div className="relative min-w-0 flex-1 overflow-hidden rounded-2xl border border-white/10 bg-black shadow-2xl">
