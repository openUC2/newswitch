# newswitch device configuration of the optikit design fluorescence.dsn.
# Generated by: uv run python -m newswitch.tools.build_design -- do not edit by hand, rebuild.
# Run it with:  NEWSWITCH_CONFIG=configs/newswitch-config.fluorescence.yaml just dev

newswitch_version: v1.0.2
devices:
  bigcamera42:
    type: detector
    name: MV-CA023-10UM
    manufacturer: HIK ROBOTICS
    tags:
      - monochrome
      - global-shutter
      - gige
    pixelcount:
      - 1920
      - 1200
    pixelpitch_um: 10.0
    exposure_time_ms:
      value: 25.0
      min: 0.024
      max: 10000.0
      inc: 0.001
      unit: ms
    framerate_per_sec:
      value: 163.0
      min: 0.5
      max: 163.0
      unit: Hz
    gain_db:
      value: 0.0
      min: 0.0
      max: 23.98
      inc: 0.01
      unit: dB
    channels: 1
    binning: 1
    trigger:
      type: hardware
      edge: rising
  hotlaser123:
    type: lightsource
    name: boison-488
    manufacturer: Boison
    coherence: coherent
    wavelength: 485.0
    max_power_mw: 100.0
  just-some-boring-stage-x:
    type: axis
    steps_per_um: 8.0
    inverted: false
    homing_required: true
    pos:
      min: 0.0
      max: 25000.0
      unit: um
    vel:
      value: 5000.0
      unit: um/s
    optikit_dsn_variable: sample-x
  just-some-boring-stage-y:
    type: axis
    steps_per_um: 8.0
    inverted: false
    homing_required: true
    pos:
      min: 0.0
      max: 25000.0
      unit: um
    vel:
      value: 5000.0
      unit: um/s
    optikit_dsn_variable: sample-y
  just-some-boring-stage-z:
    type: axis
    steps_per_um: 25.0
    inverted: true
    homing_required: true
    pos:
      min: 0.0
      max: 10000.0
      unit: um
    vel:
      value: 5000.0
      unit: um/s
    optikit_dsn_variable: sample-z
  just-some-boring-stage:
    type: stage
    name: xyz-linear-100
    manufacturer: openUC2
    axes:
      x: just-some-boring-stage-x
      y: just-some-boring-stage-y
      z: just-some-boring-stage-z
  my-favorite-mainboard:
    type: controller
    name: UC2-Mainboard-v4
    manufacturer: openUC2
    connection:
      protocol: uc2-rest
      transport:
        type: serial
        port_pattern: /dev/ttyUSB*
        baudrate: 115200
    mapping: {}
    firmware:
      name: esp32-uc2-standalone-4
      version: v2026.0.0-beta.3
assets:
  design: assets/design/f59c2fb9bf4105e5-c1.glb
ui:
  catalog: newswitch@1
  bloks:
    view-3d:
      description: '3D: the microscope of the design fluorescence.dsn; click a device for its controls.'
      default: true
      bsx: |
        <div className="h-full w-full overflow-hidden bg-muted/30">
        <Scene camera="iso" height="100%">
            <Model id="design" src="@self.assets.design">
                <Move node="sample_x" axis="1 0 0" value="@self.StageState.x" scale="1e-06" offset="0" />
                <Move node="sample_y" axis="0 -1 0" value="@self.StageState.y" scale="1e-06" offset="0" />
                <Move node="sample_z" axis="0 0 1" value="@self.StageState.z" scale="1e-06" offset="0" />
                <Glow node="blue_laser" on="$state.self.IlluminationState.illuminations.0.is_active" color="#38bdf8" intensity="0.6" />
                <Glow node="camera" on="@self.CameraState.is_acquiring" color="#22c55e" intensity="0.5" />
                <OnClick node="blue_laser" open="design-laser" />
                <OnClick node="camera" open="design-camera" />
                <OnClick node="sample_stage" open="design-stage" />
                <Popout node="camera" open="@self.CameraState.is_acquiring">
            <div className="aspect-video w-[360px] overflow-hidden rounded-md"><LiveView /></div>
        </Popout>
            </Model>
        </Scene>
        </div>
    design-camera:
      description: "The design's camera: opens where it is clicked."
      bsx: |
        <div className="flex w-[380px] flex-col gap-3 past:opacity-80 past:grayscale">
                        
        <div className="flex flex-col gap-3">
            <foreach items="@self.CameraState.detectors" let="#camera">
                <div className="relative overflow-hidden rounded-2xl border border-white/10 bg-zinc-950/70 p-4 shadow-xl">
                    <div className="flex items-center gap-2">
                        <div className="flex flex-col">
                            <span text="Detection" className="text-[10px] font-medium uppercase tracking-[0.2em] text-muted-foreground" />
                            <span text="@camera.name" className="truncate text-sm font-medium" />
                        </div>
                        <div className="ml-auto">
                            <if when="@self.CameraState.is_acquiring" then="camera-live" else="camera-idle">
                                <div id="camera-live" className="flex items-center gap-1.5 rounded-full bg-red-500/15 px-2.5 py-1 text-[11px] font-medium text-red-300">
                                    <span className="size-1.5 animate-pulse rounded-full bg-red-400" />
                                    <span text="Live" />
                                </div>
                                <div id="camera-idle" className="flex items-center gap-1.5 rounded-full bg-white/5 px-2.5 py-1 text-[11px] text-muted-foreground">
                                    <span className="size-1.5 rounded-full bg-white/30" />
                                    <span text="Idle" />
                                </div>
                            </if>
                        </div>
                    </div>
                    <div className="mt-4 grid grid-cols-2 gap-3">
                        <div className="flex min-w-0 flex-col gap-2 rounded-xl bg-white/[0.03] p-3">
                            <span text="Exposure" className="text-[10px] font-medium uppercase tracking-[0.2em] text-muted-foreground" />
                            <div className="flex items-baseline gap-1">
                                <span text="@utils.fmt.number(value=utils.math.multiply(values=[camera.current_exposure_time, 1000]), maximumFractionDigits=1)" className="text-2xl font-semibold tabular-nums" />
                                <span text="ms" className="text-xs text-muted-foreground" />
                            </div>
                            <Slider className="min-w-0 past:hidden" step="0.1" value="@utils.math.multiply(values=[camera.current_exposure_time, 1000])" min="@utils.math.multiply(values=[camera.min_exposure_time, 1000])" max="@utils.math.multiply(values=[camera.max_exposure_time, 1000])" onCommit="@self.update_detector(camera.slot, exposure_time=utils.math.divide(a=event, b=1000))" />
                        </div>
                        <div className="flex min-w-0 flex-col gap-2 rounded-xl bg-white/[0.03] p-3">
                            <span text="Gain" className="text-[10px] font-medium uppercase tracking-[0.2em] text-muted-foreground" />
                            <div className="flex items-baseline gap-1">
                                <span text="@utils.fmt.number(value=camera.current_gain, maximumFractionDigits=1)" className="text-2xl font-semibold tabular-nums" />
                                <span text="dB" className="text-xs text-muted-foreground" />
                            </div>
                            <Slider className="min-w-0 past:hidden" step="0.1" value="@camera.current_gain" min="@camera.min_gain" max="@camera.max_gain" onCommit="@self.update_detector(camera.slot, gain=event)" />
                        </div>
                    </div>
                    <div className="mt-3 flex items-center gap-2 rounded-xl border border-amber-300/15 bg-amber-300/5 px-3 py-2">
                        <span text="Light per frame" className="text-xs text-amber-200/80" />
                        <span text="@utils.str.concat(values=[utils.fmt.number(value=utils.math.multiply(values=[camera.current_exposure_time, 1000]), maximumFractionDigits=1), ' ms at ', utils.fmt.percent(value=utils.math.divide(a=utils.obj.get(value=utils.list.first(value=self.IlluminationState.illuminations), path='intensity'), b=utils.obj.get(value=utils.list.first(value=self.IlluminationState.illuminations), path='max_intensity')))])" className="ml-auto text-xs font-medium tabular-nums text-amber-200" />
                    </div>
                    <span text="Longer and brighter collects more photons, and bleaches more." className="mt-2 block text-[11px] text-muted-foreground" />
                </div>
            </foreach>
        </div>
                        <div className="flex gap-2 past:hidden">
                            <Button label="Start live view" icon="play" onClick="@self.start_live_view()" />
                            <Button label="Stop" icon="square" variant="outline" onClick="@self.stop_live_view()" />
                        </div>
                        <div className="aspect-video w-full overflow-hidden rounded-md past:hidden"><LiveView /></div>
                    </div>
