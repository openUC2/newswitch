agent_ui:
  catalog: orkestrator@v4.2.1
  bloks:
    view-microscope:
      description: 'Microscope: the camera streams, live view and acquiring.'
      default: true
      bsx: |
        <Html>
        <div className="flex flex-col gap-4 p-4">
            <Card>
                <CardHeader><CardTitle>Cameras</CardTitle></CardHeader>
                <CardContent>
                    <foreach items={self.CameraStreams.streams} let="stream">
                        <StructureDisplay value={stream} />
                    </foreach>
                </CardContent>
            </Card>
            <div className="flex gap-2">
                <Button icon="play" onClick={self.start_live_view()}>Start live view</Button>
                <Button icon="square" onClick={self.stop_live_view()}>Stop</Button>
                <Button icon="camera" onClick={self.capture_image()}>Acquire</Button>
                <Button icon="home" onClick={self.move_home()}>Home stage</Button>
            </div>
        </div>
        </Html>
    agent-camera:
      description: "The design's camera: opens where it is clicked in the 3D view."
      bsx: |
        <Html>
        <div className="grid w-[340px] gap-3">
            <foreach items={self.CameraStreams.streams} let="stream">
                <StructureDisplay value={stream} className="w-full" />
            </foreach>
            <div className="flex gap-2">
                <Button icon="play" onClick={self.start_live_view()}>Start live view</Button>
                <Button icon="square" variant="outline" onClick={self.stop_live_view()}>Stop</Button>
                <Button icon="camera" variant="secondary" onClick={self.capture_image()}>Acquire</Button>
            </div>
        </div>
        </Html>
    agent-laser:
      description: "The design's laser: opens where it is clicked in the 3D view."
      bsx: |
        <Html>
        <div className="grid w-[300px] gap-3">
            <foreach items={self.IlluminationState.illuminations} let="light" key={light.slot}>
                <div className="flex items-center justify-between gap-3">
                    <div className="grid">
                        <Text weight="medium">{light.wavelength} nm</Text>
                        <Text size="xs" tone="muted">Channel {light.slot}</Text>
                    </div>
                    <div className="flex gap-2">
                        <Button size="sm" disabled={light.is_active} onClick={self.turn_on_illumination(channel: light.slot)}>On</Button>
                        <Button size="sm" variant="outline" onClick={self.turn_off_illumination_channel(channel: light.slot)}>Off</Button>
                    </div>
                </div>
            </foreach>
        </div>
        </Html>
    agent-stage:
      description: "The design's stage: opens where it is clicked in the 3D view."
      bsx: |
        <Html>
        <div className="grid w-[300px] gap-3">
            <div className="grid grid-cols-3 gap-2">
                <div className="rounded-md border bg-muted/40 px-3 py-2">
                    <Text size="xs" tone="muted">X (µm)</Text>
                    <Text mono={true} weight="semibold">{fmt.number(value: self.StageState.x, digits: 0)}</Text>
                </div>
                <div className="rounded-md border bg-muted/40 px-3 py-2">
                    <Text size="xs" tone="muted">Y (µm)</Text>
                    <Text mono={true} weight="semibold">{fmt.number(value: self.StageState.y, digits: 0)}</Text>
                </div>
                <div className="rounded-md border bg-muted/40 px-3 py-2">
                    <Text size="xs" tone="muted">Z (µm)</Text>
                    <Text mono={true} weight="semibold">{fmt.number(value: self.StageState.z, digits: 0)}</Text>
                </div>
            </div>
            <Button icon="home" variant="outline" onClick={self.move_home()}>Home stage</Button>
        </div>
        </Html>
    view-3d:
      description: '3D: the microscope of the design fluorescence.dsn; the stage follows it, laser and camera light up while on, click a device for its controls.'
      default: true
      bsx: |
        <Scene camera="iso" height="100%">
            <Model src={self.assets.design}>
                <Move node="sample_x" axis="1 0 0" value={self.StageState.x} scale={1e-06} offset={0} />
                <Move node="sample_y" axis="0 -1 0" value={self.StageState.y} scale={1e-06} offset={0} />
                <Move node="sample_z" axis="0 0 1" value={self.StageState.z} scale={1e-06} offset={0} />
                <Glow node="blue_laser" on={obj.get(value: list.at(value: self.IlluminationState.illuminations, index: 0), key: "is_active")} color="info" intensity={0.6} />
                <Glow node="camera" on={self.CameraState.is_acquiring} color="success" intensity={0.5} />
                <OnClick node="blue_laser" open="agent-laser" />
                <OnClick node="camera" open="agent-camera" />
                <OnClick node="sample_stage" open="agent-stage" />
                <Popout node="camera" open={self.CameraState.is_acquiring}>
            <div className="w-[320px] overflow-hidden rounded-md">
                <foreach items={self.CameraStreams.streams} let="stream">
                    <StructureDisplay value={stream} className="w-full" />
                </foreach>
            </div>
        </Popout>
            </Model>
        </Scene>
