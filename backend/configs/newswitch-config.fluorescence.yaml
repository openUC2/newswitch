agent_ui:
  catalog: orkestrator@v4.2.1
  bloks:
    view-microscope:
      description: 'Microscope: the camera streams, live view and acquiring.'
      default: true
      bsx: |
        <div className="flex flex-col gap-4 p-4">
            <Card>
                <CardHeader><CardTitle text="Cameras" /></CardHeader>
                <CardContent>
                    <foreach items="@self.CameraStreams.streams" let="#stream">
                        <StructureDisplay value="@stream" />
                    </foreach>
                </CardContent>
            </Card>
            <div className="flex gap-2">
                <Button label="Start live view" icon="play" onClick="@self.start_live_view()" />
                <Button label="Stop" icon="square" onClick="@self.stop_live_view()" />
                <Button label="Acquire" icon="camera" onClick="@self.capture_image()" />
                <Button label="Home stage" icon="home" onClick="@self.move_home()" />
            </div>
        </div>
    agent-camera:
      description: "The design's camera: opens where it is clicked in the 3D view."
      bsx: |
        <div className="grid w-[340px] gap-3">
            <foreach items="@self.CameraStreams.streams" let="#stream">
                <StructureDisplay value="@stream" className="w-full" />
            </foreach>
            <div className="flex gap-2">
                <Button label="Start live view" icon="play" onClick="@self.start_live_view()" />
                <Button label="Stop" icon="square" variant="outline" onClick="@self.stop_live_view()" />
                <Button label="Acquire" icon="camera" variant="secondary" onClick="@self.capture_image()" />
            </div>
        </div>
    agent-laser:
      description: "The design's laser: opens where it is clicked in the 3D view."
      bsx: |
        <div className="grid w-[300px] gap-3">
            <foreach items="@self.IlluminationState.illuminations" let="#light">
                <div className="flex items-center justify-between gap-3">
                    <div className="grid">
                        <Text weight="medium" text="@utils.str.concat(values=[light.wavelength, ' nm'])" />
                        <Text size="xs" tone="muted" text="@utils.str.concat(values=['Channel ', light.slot])" />
                    </div>
                    <div className="flex gap-2">
                        <Button label="On" size="sm" disabled="@light.is_active" onClick="@self.turn_on_illumination(channel=light.slot)" />
                        <Button label="Off" size="sm" variant="outline" onClick="@self.turn_off_illumination_channel(channel=light.slot)" />
                    </div>
                </div>
            </foreach>
        </div>
    agent-stage:
      description: "The design's stage: opens where it is clicked in the 3D view."
      bsx: |
        <div className="grid w-[300px] gap-3">
            <div className="grid grid-cols-3 gap-2">
                <div className="rounded-md border bg-muted/40 px-3 py-2">
                    <Text size="xs" tone="muted" text="X (µm)" />
                    <Text mono="true" weight="semibold" text="@utils.fmt.number(value=self.StageState.x, maximumFractionDigits=0)" />
                </div>
                <div className="rounded-md border bg-muted/40 px-3 py-2">
                    <Text size="xs" tone="muted" text="Y (µm)" />
                    <Text mono="true" weight="semibold" text="@utils.fmt.number(value=self.StageState.y, maximumFractionDigits=0)" />
                </div>
                <div className="rounded-md border bg-muted/40 px-3 py-2">
                    <Text size="xs" tone="muted" text="Z (µm)" />
                    <Text mono="true" weight="semibold" text="@utils.fmt.number(value=self.StageState.z, maximumFractionDigits=0)" />
                </div>
            </div>
            <Button label="Home stage" icon="home" variant="outline" onClick="@self.move_home()" />
        </div>
    view-3d:
      description: '3D: the microscope of the design fluorescence.dsn; the stage follows it, laser and camera light up while on, click a device for its controls.'
      default: true
      context: scene
      bsx: |
        <Scene camera="iso" height="100%">
            <Model id="design" src="@self.assets.design">
                <Move node="sample_x" axis="1 0 0" value="@self.StageState.x" scale="1e-06" offset="0" />
                <Move node="sample_y" axis="0 -1 0" value="@self.StageState.y" scale="1e-06" offset="0" />
                <Move node="sample_z" axis="0 0 1" value="@self.StageState.z" scale="1e-06" offset="0" />
                <Glow node="blue_laser" on="$state.self.IlluminationState.illuminations.0.is_active" color="#38bdf8" intensity="0.6" />
                <Glow node="camera" on="@self.CameraState.is_acquiring" color="#22c55e" intensity="0.5" />
                <OnClick node="blue_laser" open="agent-laser" />
                <OnClick node="camera" open="agent-camera" />
                <OnClick node="sample_stage" open="agent-stage" />
                <Popout node="camera" open="@self.CameraState.is_acquiring">
            <div className="w-[320px] overflow-hidden rounded-md">
                <foreach items="@self.CameraStreams.streams" let="#stream">
                    <StructureDisplay value="@stream" className="w-full" />
                </foreach>
            </div>
        </Popout>
            </Model>
        </Scene>
