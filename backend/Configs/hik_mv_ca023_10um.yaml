# HIKROBOT MV-CA023-10UM - same content as the JSON variant
name: MV-CA023-10UM
manufacturer: HIK ROBOTICS
camera_id: hik-mv-ca023-001

pixelcount:
  x: 1920
  y: 1200

pixelpitch_um:
  x: 10.0        # y omitted -> derived as 10.0 (square pixels)

channels: 1

# Expanded form: current value plus the limits the device reports.
exposure_time_ms:
  value: 10.0
  min: 0.024
  max: 10000.0
  increment: 0.001

framerate_per_sec:
  value: 163.0
  min: 0.5
  max: 163.0

gain_db:
  value: 0.0
  min: 0.0
  max: 23.98
  increment: 0.01

# Shorthand form is still accepted where limits do not matter:
#   exposure_time_ms: 10.0

binning: 1

trigger:
  type: hardware
  edge: rising

tags:
  - monochrome
  - global-shutter
  - gige
