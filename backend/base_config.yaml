# base_config.yaml -- base settings of newswitch, read by main_fastapi.Settings.
# This file belongs to newswitch. Do not delete it: the backend does not start without it.
#
# Host and port are not set here. They come from BACKEND_HOST / BACKEND_PORT in the
# repository's root .env (deployment via docker is still an open point).

use_virtual_microscope: true
# SQLite file of the arkitekt agent (state history, journal); relative to the working
# directory. Not the old agent_data.db: the store of rekuest_next cannot be read.
db_path: arkitekt_agent.db
available_cubes: [cube1, cube2, cube3]

# Folders; relative paths are taken relative to this file's folder (backend/)
config_dir: configs
schema_dir: configs/schemas

# Device configuration; bare names are resolved against config_dir.
# newswitch never writes static_config_path; changes always go into persistent_config_path.
static_config_path: newswitch-config.yaml
persistent_config_path: newswitch-config.persistent.yaml
# true:  read  static_config_path; on shutdown persistent_config_path is overwritten
#        with it plus the runtime changes
# false: read (and write back) persistent_config_path; on first start it is created
#        as a copy of static_config_path
load_from_static_config_path: true

# The UI is the `ui` section of the device configuration (configs/README.md): bloks
# checked against the catalog the frontend publishes. A design's configuration, UI and
# 3D model included, is built with `just build-design`.

# Folder the cameras (uc2_cam_py, extra "camera") record into; relative to this file's
# folder. Recording is switched on per camera (store_image_data in its mapping entry).
camera_recording_dir: data/recordings

# Where the file IO writes, and where acquired frames are cached (cleared on every start);
# relative to this file's folder.
image_dir: /tmp/newswitch/images
cache_dir: /tmp/newswitch/cache

# Debug view without the frontend: every camera (real hardware only) opens a window that
# shows its newest image, and acquires from startup on so the window always has one (with
# store_image_data that means recording all the time). Without an X11 display only an
# error is logged. Set false on headless machines.
camera_debug_window: true
