# sys_config.yaml -- global settings of the newswitch backend, whatever the microscope.
# Read by newswitch.sys_config. The backend and its tools do not start without it; every key
# must be there, and an unknown one is an error.
# What belongs to one microscope is in its microscope.yml (`settings`).

# Logging of the backend (the frontend logs in the browser). Each output gets records from
# its level up: fatal | error | warn | info | debug, or none for no output at all.
# What a command-line tool reports as its result (just uc2 scan, ...) is written to the
# terminal whatever log_to_terminal says, and to the log file like everything else.
log_to_terminal: warn
log_to_file: debug
# Log file, relative to backend/. It is appended to and rotated at 10 MB (backend.log.1 ... .3
# are kept). null, or not openable (e.g. its folder does not exist): backend/backend.log is
# used, with a warning in it.
log_file_path: backend.log

# Cameras: true shows every real camera's newest image in a window of uc2_cam_py (debugging
# without the frontend), and the cameras acquire from startup on. Simulated cameras show none;
# without a display (headless) only an error is logged and the camera works anyway.
camera_debug_window: false
