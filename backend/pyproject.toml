[project]
name = "newswitch"
version = "1.0.2"
readme = "README.md"
readme-content-type = "text/markdown"
homepage = "https://arkitekt.live"
description = "A better openuc2 backend"
authors = [{ name = "jhnnsrs", email = "jhnnsrs@gmail.com" }]
requires-python = ">=3.11, <3.13"
license = "GPL-3.0-or-later"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.128.0",
    "kaffine==1.1.0",
    "lz4>=4.4.5",
    "numpy>=2.4.1",
    "pillow>=12.1.0",
    "pint>=0.25.2",
    "pydantic>=2.11.4",
    "pyserial-asyncio>=0.6",
    "pystackreg>=0.2.8",
    "arkitekt==8.0.0",
    "arkitekt-fastapi==2.1.0",
    "arkitekt-runtime==5.1.0",
    "arkitekt-spec==3.18.0",
    "koil>=3.3.6",
    "pyyaml>=6",
    "scipy>=1.17.0",
    "tifffile>=2026.1.28",
    "useq-schema>=0.8.1",
    "uvicorn>=0.40.0",
    # uvicorn serves websockets (/ws, /stream) only with a websocket library installed;
    # without one an upgrade is handled as plain HTTP and fails auth with a 401.
    "websockets>=15",
    "zarrs>=0.2.2",
    "zstandard>=0.25.0",
    "argon2-cffi>=25.1.0",
    "jsonschema>=4.18",
    "pydantic-settings>=2",
    "ruamel-yaml>=0.18",
]

[project.optional-dependencies]
types = [
    "annotated-types>=0.5.0",
]
# Real openUC2 hardware transports. uc2rest.aio is not in the current PyPI
# release, so use the verified upstream revision that provides AsyncUC2Client.
uc2 = [
    "uc2-rest @ git+https://github.com/openUC2/UC2-REST.git@60f15bfc543baf41e46996cd149b298419de5eac",
    "uc2canopen>=0.2.0",
]
# Cameras through uc2_cam_py (newswitch.managers.uc2.uc2_detector), pinned to a commit;
# to update, enter the new SHA and run `uv lock`. Its C++ extension needs the MVS SDK
# (/opt/MVS) to build, also for the simulated camera, and Python 3.12 - hence the markers,
# and CI leaves this extra out.
# A microscope described by an optikit design (`design` in base_config.yaml): pyvista cuts
# the design's CAD meshes down to a model a browser can show (newswitch.design.model).
design = [
    "pyvista>=0.48.4",
]
camera = [
    "uc2-cam-py @ git+https://github.com/openUC2/UC2_cam_py.git@ccfb0e9dd00930d959e918a6a7dd6635c31ef142 ; sys_platform == 'linux' and python_version == '3.12'",
]

[tool.uv]
dev-dependencies =  [
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=6.1.1",
    "pytest>=8.3.5",
    "testcontainers==3.7.0",
    "autoflake>=1.7.7,<2",
    "aiohttp>=3.8.3,<4",
    "pytest-aiohttp>=1.0.4,<2",
    "ruff>0.11",
    "qtpy>=2.4.3",
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "opencv-python-headless>=4.13.0.90",
    "scipy-stubs>=1.17.1.0",
]


[tool.ruff.lint]
extend-select = ["ANN", "D1", "F401"]

[tool.ruff]


# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 100
# Vendored optikit code (see its header), kept in its own style.
extend-exclude = ["newswitch/optikit/dsn.py"]

[tool.hatch.build.targets.sdist]
include = ["newswitch"]

[tool.hatch.build.targets.wheel]
include = ["newswitch"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
markers = [
    "integration: marks tests that require a running server",
    "define: marks tests that concern to definining a funcionality",
    "shrink: marks tests that concern to serializing inputs to requests to an actor",
    "expand: marks tests that concern to serializing outputs from answers of an actor",
    "actor: marks tests that concern actors",
]

testpaths = ["tests"]

[[tool.pydoc-markdown.loaders]]
type = "python"
search_path = ["newswitch"]

[tool.pydoc-markdown.renderer]
type = "docusaurus"
docs_base_path = "website/docs"

# Releases are driven from the monorepo root (release.config.cjs + JS semantic-release),
# which bumps this file's version alongside frontend/package.json. GitHub Releases only.

