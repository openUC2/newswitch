# FLIM: a point scanner whose detector also times each photon against the laser's pulse, so that
# every pixel is a histogram of arrival times. See `drives`, and the detector's `microtime` axis.
# Simulated only: nothing here reads a real point detector yet, and one lifetime holds everywhere.
#
# Run it:      NEWSWITCH_CONFIG=instruments/flim just dev

spec: newswitch/instrument/v0
name: flim

cubes:
  laser_488:
    element: {kind: source, emits: laser, spectrum: {center: 488 nm, width: 2 nm}, max_power: 50 mW, repetition: 40 MHz}
    signals:
      out: {sync: {}}   # a pulse per laser pulse
    tunes:
      power: {actuator: laser-dac, initial: 0 mW, step: 1 mW, max: 50 mW}

  dichroic:
    element: {kind: dichroic, curve: lp_500}

  galvo:
    component: generic-galvo-512

  scan_lens:
    element: {kind: lens, f: 50 mm}

  tube:
    element: {kind: lens, f: 200 mm}

  objective:
    element: {kind: lens, name: f20 NA 0.25, f: 20 mm, na: 0.25, immersion: air, working_distance: 10 mm}

  stage:
    element:
      kind: sample
      simulations:   # what can be on it; settings.simulation says which is
        gfp-beads:
          fluorophore: egfp
          absorbed: 1.0e-4
          transmit: 0.9   # light going straight through (transmitted light)
          reflect: 1.0e-6  # light coming back the way it came (epi)
          pattern: {beads: 3600, radius: 10 um, depth: 4 um}
    moves:
      x: {actuator: stg-x, along: x, initial: 0 um, step: 10 um, min: -5000 um, max: 5000 um, speed: 5000 um/s}
      y: {actuator: stg-y, along: y, initial: 0 um, step: 10 um, min: -5000 um, max: 5000 um, speed: 5000 um/s}
      z: {actuator: stg-z, along: axis, initial: 0 um, step: 100 um, min: -500 um, max: 500 um, speed: 500 um/s}

  filter_green:
    element: {kind: filter, name: BP 525/50, curve: bp_525_50}

  pinhole:
    element: {kind: pinhole, diameter: 50 um}

  spad:
    component: generic-spad-64
    tunes:   # exposure is the time to scan a frame
      frame_rate: {initial: 1 Hz, min: 1 Hz, max: 100 Hz, step: 1 Hz}
      exposure: {initial: 1000 ms, step: 100 ms, min: 1 ms, max: 10 s}
      gain: {initial: 0 dB, step: 1 dB, min: 0 dB, max: 40 dB}

illumination:
  - {from: laser_488, to: dichroic}
  - {from: dichroic, via: reflect, to: galvo}
  - {from: galvo, to: scan_lens, distance: focus}
  - {from: scan_lens, to: tube, distance: 250 mm}
  - {from: tube, to: objective, distance: 220 mm}
  - {from: objective, to: stage, side: epi, distance: focus}

detection:
  - {from: stage, to: objective}
  - {from: objective, to: tube}
  - {from: tube, to: scan_lens}
  - {from: scan_lens, to: galvo}
  - {from: galvo, to: dichroic}
  - {from: dichroic, via: transmit, to: filter_green}
  - {from: filter_green, to: pinhole}
  - {from: pinhole, to: spad}

drives:
  - {from: galvo.pixel, to: spad.sample}
  - {from: laser_488.sync, to: spad.sync}

# Example wiring: no rig stands behind this file, and the board, axes and steps_per_um are made up.
# `simulate: everything` below never builds it; for a real rig, state what is really there.
hardware:
  boards:
    uc2: {transport: canopen, interface: socketcan, channel: can0}
  actuators:
    stg-x: {driver: uc2.stepper, board: uc2, axis: X, steps_per_um: 3.2}
    stg-y: {driver: uc2.stepper, board: uc2, axis: Y, steps_per_um: 3.2}
    stg-z: {driver: uc2.stepper, board: uc2, axis: Z, steps_per_um: 3.2}
    laser-dac: {driver: uc2.laser, board: uc2, channel: 1, pwm_max: 1023}

settings:
  simulate: everything
  simulation: gfp-beads
  db_path: arkitekt_agent.db
  image_dir: /tmp/newswitch/images
  cache_dir: /tmp/newswitch/cache
  camera_recording_dir: data/recordings
  camera_debug_window: false

ui:
  catalog: newswitch@6
  bloks:
    view-flim:
      description: 'FLIM: the lifetime axis the SPAD delivers, the beam and the focus.'
      default: true
      file: view.bsx
    view-acquire:
      description: 'Acquire: time, positions, z planes and detectors, stored in mikro.'
      file: ../views/acquire.bsx
    view-stage:
      description: 'Stage: the sample on the stage, with the images taken there.'
      file: ../views/stage.bsx
