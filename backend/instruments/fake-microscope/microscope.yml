                        <span className="size-2 rounded-full bg-success shadow-[0_0_10px_2px] shadow-success/60" />
                        <span className="text-sm font-medium">{lens.name}</span>
                    </div>
                <else>
                    <Button variant="ghost" fullWidth={true} className="justify-start rounded-xl" onClick={self.switch_objective(slot: lens.slot)}>{lens.name}</Button>
                </else>
                </if>
            </foreach>
        </div>
        <div className="relative overflow-hidden rounded-2xl border border-border/60 bg-card/70 p-4 shadow-xl flex flex-col gap-2 past:pointer-events-none">
            <span className="text-[10px] font-medium uppercase tracking-[0.2em] text-muted-foreground">Emission filter</span>
            <foreach items={self.FilterBankState.filters} let="filter" key={filter.slot}>
                <if when={filter.slot == self.FilterBankState.current_slot}>
                    <div className="flex items-center gap-3 rounded-xl border border-success/40 bg-success/10 px-3 py-2">
                        <span className="size-2 rounded-full bg-success shadow-[0_0_10px_2px] shadow-success/60" />
                        <span className="text-sm font-medium">{filter.name}</span>
                        <if when={filter.center_wavelength > 0}>
                            <span className="ml-auto text-xs tabular-nums text-muted-foreground">{filter.center_wavelength}/{filter.bandwidth} nm</span>
                        </if>
                    </div>
                <else>
                    <Button variant="ghost" fullWidth={true} className="justify-start rounded-xl" onClick={self.switch_filter(slot: filter.slot)}>{filter.name}</Button>
                </else>
                </if>
            </foreach>
        </div>
        <div className="flex flex-col gap-3">
            <foreach items={self.CameraState.detectors} let="camera" key={camera.slot}>
                <div className="relative overflow-hidden rounded-2xl border border-border/60 bg-card/70 p-4 shadow-xl">
                    <div className="flex items-center gap-2">
                        <div className="flex flex-col">
                            <span className="text-[10px] font-medium uppercase tracking-[0.2em] text-muted-foreground">Detection</span>
                            <span className="truncate text-sm font-medium">{camera.name}</span>
                        </div>
                        <div className="ml-auto">
                            <if when={self.CameraState.is_acquiring}>
                                <div className="flex items-center gap-1.5 rounded-full bg-destructive/15 px-2.5 py-1 text-[11px] font-medium text-destructive">
                                    <span className="size-1.5 animate-pulse rounded-full bg-destructive" />
                                    <span>Live</span>
                                </div>
                            <else>
                                <div className="flex items-center gap-1.5 rounded-full bg-muted/50 px-2.5 py-1 text-[11px] text-muted-foreground">
                                    <span className="size-1.5 rounded-full bg-muted-foreground/30" />
                                    <span>Idle</span>
                                </div>
                            </else>
                            </if>
                        </div>
                    </div>
                    <div className="mt-4 grid grid-cols-2 gap-3">
                        <div className="flex min-w-0 flex-col gap-2 rounded-xl bg-muted/30 p-3">
                            <span className="text-[10px] font-medium uppercase tracking-[0.2em] text-muted-foreground">Exposure</span>
                            <div className="flex items-baseline gap-1">
                                <span className="text-2xl font-semibold tabular-nums">{fmt.number(value: math.mul(a: camera.current_exposure_time, b: 1000), digits: 1)}</span>
                                <span className="text-xs text-muted-foreground">ms</span>
                            </div>
                            <Slider className="min-w-0 past:hidden" step={0.1} value={math.mul(a: camera.current_exposure_time, b: 1000)} min={math.mul(a: camera.min_exposure_time, b: 1000)} max={math.mul(a: camera.max_exposure_time, b: 1000)} onCommit={self.update_detector(slot: camera.slot, exposure_time: math.div(a: event.value, b: 1000))} />
                        </div>
                        <div className="flex min-w-0 flex-col gap-2 rounded-xl bg-muted/30 p-3">
                            <span className="text-[10px] font-medium uppercase tracking-[0.2em] text-muted-foreground">Gain</span>
                            <div className="flex items-baseline gap-1">
                                <span className="text-2xl font-semibold tabular-nums">{fmt.number(value: camera.current_gain, digits: 1)}</span>
                                <span className="text-xs text-muted-foreground">dB</span>
                            </div>
                            <Slider className="min-w-0 past:hidden" step={0.1} value={camera.current_gain} min={camera.min_gain} max={camera.max_gain} onCommit={self.update_detector(slot: camera.slot, gain: event.value)} />
                        </div>
                    </div>
                    <div className="mt-3 flex items-center gap-2 rounded-xl border border-warning/15 bg-warning/5 px-3 py-2">
                        <span className="text-xs text-warning/80">Light per frame</span>
                        <span className="ml-auto text-xs font-medium tabular-nums text-warning">{fmt.number(value: math.mul(a: camera.current_exposure_time, b: 1000), digits: 1)} ms at {fmt.percent(value: math.div(a: obj.get(value: list.first(value: self.IlluminationState.illuminations), key: "intensity"), b: obj.get(value: list.first(value: self.IlluminationState.illuminations), key: "max_intensity")))}</span>
                    </div>
                    <span className="mt-2 block text-[11px] text-muted-foreground">Longer and brighter collects more photons, and bleaches more.</span>
                </div>
            </foreach>
        </div>
                </div>
            </ScrollArea>
            <div className="relative min-w-0 flex-1 overflow-hidden rounded-2xl border border-border/60 bg-background shadow-2xl">
                <div className="h-full past:opacity-40">
                    <LiveView className="h-full" />
                </div>
                <div className="absolute bottom-5 right-4">
        <div className="flex gap-1 rounded-full border border-border/60 bg-card/70 p-1 backdrop-blur past:hidden">
            <Button icon="play" size="sm" variant="ghost" className="rounded-full" onClick={self.start_live_view()}>Live</Button>
            <Button icon="square" size="sm" variant="ghost" className="rounded-full" onClick={self.stop_live_view()}>Stop</Button>
        </div>
                </div>
                <div className="absolute bottom-5 left-1/2 w-[min(26rem,80%)] -translate-x-1/2">
        <if when={!list.contains(value: list.pluck(value: obj.values(value: self.OpticsState.detectors), key: "calibrated"), item: true)}>
            <div className="flex items-center gap-3 rounded-2xl border border-warning/30 bg-card/80 p-3 shadow-xl backdrop-blur past:hidden">
                <div className="flex min-w-0 flex-1 flex-col">
                    <span className="text-sm font-medium text-warning">Light path not calibrated</span>
                    <span className="text-xs text-muted-foreground">Calibrate once: images then get their pixel size and their place on the stage.</span>
                </div>
                <Button icon="wand" size="sm" className="shrink-0 rounded-full bg-warning text-warning-foreground hover:bg-warning/80" onClick={self.calibrate_light_path()}>Calibrate</Button>
            </div>
        <else>
            <Button icon="camera" size="lg" fullWidth={true} className="h-12 rounded-full text-base shadow-xl past:hidden" onClick={self.capture_image()}>Acquire</Button>
        </else>
        </if>
                </div>
            </div>
        </div>
        </Html>
    view-stage:
      description: 'Stage: the sample on the stage, with the images taken there.'
      bsx: |
        <Html>
        <Resizable direction="row" className="h-full w-full">
            <ResizablePanel defaultSize={70}>
                <div className="flex h-full flex-col overflow-hidden bg-muted/30">
                    <StageView className="flex-1">
                        <StageScene>
                            <StageAxis />
                            <StagePlane />
                            <FramesLayer />
                            <ImagesLayer />
                            <LivesLayer />
                            <FrameLightPathLayer />
                            <LightPathLayer />
                            <StagePositioner />
                            <RectangleDrawer />
                        </StageScene>
                        <ElementPanel />
                        <ScanRegionPanel />
                        <ImageMetadataPanel />
                        <FramePanel />
                        <SceneOverlay />
                    </StageView>
                </div>
            </ResizablePanel>
            <ResizableHandle withHandle={true} />
            <ResizablePanel defaultSize={30} minSize={20} maxSize={45}>
                <ScrollArea className="h-full">
                    <div className="flex flex-col gap-4 p-4 past:opacity-70 past:grayscale">
                        <StageControl className="locked:opacity-60" />

        <if when={!list.contains(value: list.pluck(value: obj.values(value: self.OpticsState.detectors), key: "calibrated"), item: true)}>
            <div className="flex items-center gap-3 rounded-2xl border border-warning/30 bg-card/80 p-3 shadow-xl backdrop-blur past:hidden">
                <div className="flex min-w-0 flex-1 flex-col">
                    <span className="text-sm font-medium text-warning">Light path not calibrated</span>
                    <span className="text-xs text-muted-foreground">Calibrate once: images then get their pixel size and their place on the stage.</span>
                </div>
                <Button icon="wand" size="sm" className="shrink-0 rounded-full bg-warning text-warning-foreground hover:bg-warning/80" onClick={self.calibrate_light_path()}>Calibrate</Button>
            </div>
        <else>
            <Button icon="camera" size="lg" fullWidth={true} className="h-12 rounded-full text-base shadow-xl past:hidden" onClick={self.capture_image()}>Acquire</Button>
        </else>
        </if>
                        <CameraControl className="locked:opacity-60" />
                    </div>
                </ScrollArea>
            </ResizablePanel>
        </Resizable>
        </Html>
    view-minimal:
      description: 'Minimal: the live image and the stage, nothing else.'
      bsx: |
        <Html>
        <Resizable direction="row" className="h-full w-full">
            <ResizablePanel defaultSize={70}>
                <div className="flex h-full flex-col gap-3 p-4">
                    <div className="flex gap-2 past:hidden">
                        <Button icon="play" onClick={self.start_live_view()}>Start live view</Button>
                        <Button icon="square" variant="outline" onClick={self.stop_live_view()}>Stop</Button>
                    </div>
                    <div className="min-h-0 flex-1 overflow-hidden rounded-lg past:opacity-40">
                        <LiveView className="h-full" />
                    </div>
                </div>
            </ResizablePanel>
            <ResizableHandle withHandle={true} />
            <ResizablePanel defaultSize={30} minSize={20} maxSize={45}>
                <ScrollArea className="h-full">
                    <div className="p-4 past:opacity-70 past:grayscale">
                        <StageControl className="locked:opacity-60" />

        <if when={!list.contains(value: list.pluck(value: obj.values(value: self.OpticsState.detectors), key: "calibrated"), item: true)}>
            <div className="flex items-center gap-3 rounded-2xl border border-warning/30 bg-card/80 p-3 shadow-xl backdrop-blur past:hidden">
                <div className="flex min-w-0 flex-1 flex-col">
                    <span className="text-sm font-medium text-warning">Light path not calibrated</span>
                    <span className="text-xs text-muted-foreground">Calibrate once: images then get their pixel size and their place on the stage.</span>
                </div>
                <Button icon="wand" size="sm" className="shrink-0 rounded-full bg-warning text-warning-foreground hover:bg-warning/80" onClick={self.calibrate_light_path()}>Calibrate</Button>
            </div>
        <else>
            <Button icon="camera" size="lg" fullWidth={true} className="h-12 rounded-full text-base shadow-xl past:hidden" onClick={self.capture_image()}>Acquire</Button>
        </else>
        </if>
                    </div>
                </ScrollArea>
            </ResizablePanel>
        </Resizable>
        </Html>

# What Orkestrator shows in agent mode (just agent): bloks drawn with the spec's catalogs and
# Orkestrator's module, the cameras as lovekit streams.
agent_ui:
  catalog: orkestrator@v4.2.1
  bloks:
    view-microscope:
      description: 'Microscope: the camera streams, live view and acquiring.'
      default: true
      bsx: |
        <Html>
        <div className="flex flex-col gap-4 p-4">
            <Card>
                <CardHeader><CardTitle>Cameras</CardTitle></CardHeader>
                <CardContent>
                    <foreach items={self.CameraStreams.streams} let="stream">
                        <StructureDisplay value={stream} />
                    </foreach>
                </CardContent>
            </Card>
            <div className="flex gap-2">
                <Button icon="play" onClick={self.start_live_view()}>Start live view</Button>
                <Button icon="square" onClick={self.stop_live_view()}>Stop</Button>
                <Button icon="camera" onClick={self.capture_image()}>Acquire</Button>
                <Button icon="home" onClick={self.move_home()}>Home stage</Button>
            </div>
        </div>
        </Html>
