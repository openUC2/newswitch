# What the designer believes the microscope is. A cube is housing around an optical element, and
# an actuator does one of three things to that element: it moves it, swaps it, or tunes it.
# Nothing here says what impacts what: the compiler works that out by nudging each variable.
#
# Run it:      NEWSWITCH_CONFIG=instruments/fake-microscope/microscope.yml just dev (or: just dev-fake)
#
# The hidden truth about this microscope is in truth.yml, which only the simulator may read.

spec: newswitch/instrument/v0
name: fake-microscope

cubes:
  laser_488:
    element: {kind: source, emits: laser, spectrum: {center: 488 nm, width: 2 nm}, max_power: 50 mW}
    tunes:
      power: {actuator: laser-dac, initial: 20 mW, step: 1 mW, max: 50 mW}

  led_625:
    element: {kind: source, emits: led, spectrum: {center: 625 nm, width: 15 nm}, max_power: 50 nW}
    tunes:
      power: {actuator: led-dac, initial: 0 mW, step: 5 nW, max: 50 nW}

  stage:
    element:
      kind: sample
      simulation: gfp-beads
      simulations:   # what can be on it; simulation: says which is
        gfp-beads:
          fluorophore: egfp
          absorbed: 5.0e-4
          transmit: 0.9   # light going straight through (transmitted light)
          reflect: 1.0e-6  # light coming back the way it came (epi)
          pattern: {beads: 3600, radius: 10 um, depth: 4 um}
        empty-slide:
          transmit: 0.95
          reflect: 1.0e-6
          pattern: {beads: 0, radius: 10 um, depth: 4 um}
      # What it is mounted on (newswitch/instrument/holders): the slide's middle on the stage's 0.
      holders:
        slide: {holder: slide-75x25, mount: {x: -37.5 mm, y: -12.5 mm}}
      mounted: slide
    moves:
      x: {actuator: stg-x, along: x, initial: 0 um, step: 10 um, min: -2000 um, max: 2000 um, speed: 2000 um/s}
      y: {actuator: stg-y, along: y, initial: 0 um, step: 10 um, min: -2000 um, max: 2000 um, speed: 2000 um/s}
      z: {actuator: stg-z, along: axis, initial: 0 um, step: 100 um, min: -500 um, max: 500 um, speed: 500 um/s}

  objective:
    swaps:
      slot:
        actuator: turret
        initial: 1
        slots:
          1: {kind: lens, name: f50 NA 0.1, f: 50 mm, na: 0.1, immersion: air, magnification: 4, working_distance: 40 mm}
          2: {kind: lens, name: f25 NA 0.2, f: 25 mm, na: 0.2, immersion: air, magnification: 8, working_distance: 18 mm}

  dichroic:
    element: {kind: dichroic, curve: lp_500}

  filter_wheel:
    swaps:
      slot:
        actuator: wheel
        initial: 1
        slots:
          1: {kind: filter, name: Open}
          2: {kind: filter, name: BP 525/50, curve: bp_525_50}

  splitter:
    element: {kind: splitter, reflect: 0.5, transmit: 0.5}

  tube_a:
    # A real achromat, from its prescription; it can be focused.
    element: {kind: lens, prescription: lenses/AC254-100-A.optiland, clear_radius: 6 mm}
    moves:
      # No actuator: a board has X, Y, Z and A, and those are taken.
      dz: {along: axis, initial: 0 um, step: 1000 um}

  camera_a:
    element:
      kind: sensor
      axes: {x: {size: 512, pitch: 10 um}, y: {size: 512, pitch: 10 um}}
      readout: scmos
    tunes:
      frame_rate: {initial: 30 Hz, min: 1 Hz, max: 100 Hz, step: 1 Hz}
      exposure: {initial: 100 ms, step: 10 ms, min: 1 ms, max: 10 s}
      gain: {initial: 0 dB, step: 1 dB, min: 0 dB, max: 40 dB}
      binning: {initial: 1, min: 1, max: 4, step: 1}

  tube_b:
    # No prescription for this one: an ideal lens, so only its focal length is known.
    element: {kind: lens, f: 200 mm}

  camera_b:
    element:
      kind: sensor
      axes: {x: {size: 512, pitch: 10 um}, y: {size: 512, pitch: 10 um}}
      readout: scmos
    tunes:
      frame_rate: {initial: 30 Hz, min: 1 Hz, max: 100 Hz, step: 1 Hz}
      exposure: {initial: 100 ms, step: 10 ms, min: 1 ms, max: 10 s}
      gain: {initial: 0 dB, step: 1 dB, min: 0 dB, max: 40 dB}
      binning: {initial: 1, min: 1, max: 4, step: 1}

# How light connects the elements, each edge in the direction light travels. Routes are found by
# walking these, so another detector is another few edges. `via` is how light leaves an element
# with more than one way out; a distance of `focus` means the lens's own focal length.
illumination:
  - {from: laser_488, to: dichroic}
  - {from: dichroic, via: reflect, to: objective}
  - {from: objective, to: stage, side: epi, field: 3 mm}
  - {from: led_625, to: stage, side: transmitted, field: 3 mm}

detection:
  - {from: stage, to: objective, distance: focus}
  - {from: objective, to: dichroic, distance: 100 mm}
  - {from: dichroic, via: transmit, to: filter_wheel, distance: 30 mm}
  - {from: filter_wheel, to: splitter, distance: 30 mm}
  - {from: splitter, via: transmit, to: tube_a, distance: 40 mm}
  - {from: tube_a, to: camera_a, distance: 97.068 mm}
  - {from: splitter, via: reflect, to: tube_b, distance: 40 mm}
  - {from: tube_b, to: camera_b, distance: focus}

# Example wiring: no rig stands behind this file, and the board, axes and steps_per_um are made up.
# `simulate: everything` below never builds it; for a real rig, state what is really there.
hardware:
  boards:
    uc2: {transport: canopen, interface: socketcan, channel: can0}
  actuators:
    stg-x: {driver: uc2.stepper, board: uc2, axis: X, steps_per_um: 3.2}
    stg-y: {driver: uc2.stepper, board: uc2, axis: Y, steps_per_um: 3.2}
    stg-z: {driver: uc2.stepper, board: uc2, axis: Z, steps_per_um: 3.2}
    turret: {driver: uc2.turret, board: uc2, positions: {1: 0, 2: 20000}}
    wheel: {driver: uc2.wheel, board: uc2, axis: A, positions: {1: 0.0, 2: 120.0}}
    laser-dac: {driver: uc2.laser, board: uc2, channel: 1, pwm_max: 1023}
    led-dac: {driver: uc2.laser, board: uc2, channel: 2, pwm_max: 1023}

settings:
  simulate: everything
  db_path: arkitekt_agent.db     # state history and journal of the arkitekt agent
  image_dir: /tmp/newswitch/images
  cache_dir: /tmp/newswitch/cache   # cleared on every start
  camera_recording_dir: data/recordings   # only cameras with store_image_data record
  camera_debug_window: true      # real cameras only: a window per camera, acquiring from startup on

# What the frontend shows: bloks in blok language v2, checked against the catalog the frontend
# publishes (newswitch/infra/ui/newswitch-catalog.json). `catalog` names the version they were written
# against; the blok marked default is shown first. A blok naming an action this microscope does not
# have is refused at startup.
ui:
  catalog: newswitch@8
  bloks:
    view-bench:
      description: 'Bench: both arms, the swaps, and what calibrating has measured.'
      default: true
      file: view.bsx
    view-fluorescence:
      description: 'Fluorescence: excitation, emission and detection, built from blok primitives.'
      file: ../views/fluorescence.bsx
    view-stage:
      description: 'Stage: the sample on the stage, with the images taken there.'
      file: ../views/stage.bsx
    view-minimal:
      description: 'Minimal: the live image and the stage, nothing else.'
      file: ../views/minimal.bsx
# What Orkestrator shows in agent mode (just agent): bloks drawn with the spec's catalogs and
# Orkestrator's module, the cameras as lovekit streams.
agent_ui:
  catalog: orkestrator@v4.2.1
  bloks:
    view-microscope:
      description: 'Microscope: the camera streams, live view and acquiring.'
      default: true
      file: ../views/agent-microscope.bsx
