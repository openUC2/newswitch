# A confocal-style point scanner: a galvo walks a focused spot over the sample, and a PMT behind a
# pinhole takes one sample per position. The scan is what makes the PMT's image: see `drives`.
# Simulated only: nothing here reads a real point detector yet, and with a flat sample the pinhole
# rejects nothing.
#
# Run it:      NEWSWITCH_CONFIG=instruments/point-scanner just dev

spec: newswitch/instrument/v0
name: point-scanner

cubes:
  laser-488:
    element: {kind: source, wavelength: 488 nm, width: 2 nm, max_power: 50 mW, coherent: true}
    tunes:
      power: {initial: 0.0, step: 1.0, units: mW}

  dichroic:
    element: {kind: dichroic, cut: 500 nm}

  galvo:
    component: generic-galvo-512

  scan-lens:
    element: {kind: lens, f: 50 mm}

  tube:
    element: {kind: lens, f: 200 mm}

  objective:
    element: {kind: lens, name: f20 NA 0.25, f: 20 mm, na: 0.25, working_distance: 10 mm}

  stage:
    element:
      kind: sample
      simulations:   # what can be on it; settings.simulation says which is
        gfp-beads:
          fluorophore: {excitation: 488 nm, excitation_width: 20 nm, emission: 515 nm, emission_width: 25 nm, quantum_yield: 0.02}
          transmit: 0.9   # light going straight through (transmitted light)
          reflect: 0.001  # light coming back the way it came (epi)
          pattern: {beads: 3600, radius: 10 um}
    moves:
      x: {along: x, initial: 0.0, step: 10.0, min: -5000.0, max: 5000.0, speed: 5000.0, units: um}
      y: {along: y, initial: 0.0, step: 10.0, min: -5000.0, max: 5000.0, speed: 5000.0, units: um}
      z: {along: axis, initial: 0.0, step: 100.0, min: -500.0, max: 500.0, speed: 500.0, units: um}

  filter-green:
    element: {kind: filter, name: BP 525/50, center: 525 nm, width: 50 nm}

  pinhole:
    element: {kind: pinhole, diameter: 50 um}

  pmt:
    component: generic-pmt
    tunes:   # exposure is the time to scan a frame
      exposure: {initial: 100.0, step: 50.0, units: ms}
      gain: {initial: 0.0, step: 1.0, units: dB}
      binning: {initial: 1, step: 1}

illumination:
  - {from: laser-488, to: dichroic}
  - {from: dichroic, via: reflect, to: galvo}
  - {from: galvo, to: scan-lens, distance: focus}
  - {from: scan-lens, to: tube, distance: 250 mm}
  - {from: tube, to: objective, distance: 220 mm}
  - {from: objective, to: stage, side: epi, distance: focus}

detection:
  - {from: stage, to: objective}
  - {from: objective, to: tube}
  - {from: tube, to: scan-lens}
  - {from: scan-lens, to: galvo}
  - {from: galvo, to: dichroic}
  - {from: dichroic, via: transmit, to: filter-green}
  - {from: filter-green, to: pinhole}
  - {from: pinhole, to: pmt}

drives:
  - {from: galvo.pixel, to: pmt.sample}

parts:
  stage: stage
  sources:
    1: {cube: laser-488, full_intensity: 100.0}
  detectors:
    1: {cube: pmt, frame_rate: 10 Hz}

settings:
  use_virtual_microscope: true
  simulation: gfp-beads
  db_path: arkitekt_agent.db
  image_dir: /tmp/newswitch/images
  cache_dir: /tmp/newswitch/cache
  camera_recording_dir: data/recordings
  camera_debug_window: false

ui:
  catalog: newswitch@2
  bloks:
    view-scan:
      description: 'Scan: the beam path, the raster on the sample, and the image it builds.'
      default: true
      bsx: |
        <Html>
        <div className="flex h-full w-full gap-3 overflow-hidden bg-gradient-to-bl from-spectrum-blue/10 via-transparent to-spectrum-green/5 p-3">
            <div className="relative min-w-0 flex-1 overflow-hidden rounded-2xl border border-border/60 bg-background shadow-2xl">
                <div className="h-full past:opacity-40">
                    <LiveView className="h-full" />
                </div>
                <div className="pointer-events-none absolute left-1/2 top-1/2 size-8 -translate-x-1/2 -translate-y-1/2">
                    <div className="absolute left-1/2 top-0 h-full w-px bg-spectrum-cyan/60" />
                    <div className="absolute left-0 top-1/2 h-px w-full bg-spectrum-cyan/60" />
                </div>
                <div className="absolute bottom-4 left-1/2 flex -translate-x-1/2 items-center gap-1 rounded-full border border-border/60 bg-card/80 p-1 shadow-xl backdrop-blur past:hidden">
                    <Button icon="play" size="sm" variant="ghost" className="rounded-full" onClick={self.start_live_view()}>Scan</Button>
                    <Button icon="square" size="sm" variant="ghost" className="rounded-full" onClick={self.stop_live_view()}>Stop</Button>
                    <if when={val.is_empty(value: self.CalibrationState.calibrated_light_paths)}>
                        <Button icon="wand" size="sm" variant="ghost" className="rounded-full text-warning" onClick={self.calibrate_light_path()}>Calibrate</Button>
                    </if>
                    <Button icon="camera" size="sm" className="rounded-full bg-spectrum-blue text-background hover:bg-spectrum-blue/80" onClick={self.capture_image()}>One frame</Button>
                </div>
            </div>

            <ScrollArea className="h-full w-[430px] shrink-0">
                <div className="flex flex-col gap-3 pb-3 pl-3">

                    <div className="flex items-center justify-between px-1 pt-1">
                        <div className="flex flex-col">
                            <span className="text-[10px] font-medium uppercase tracking-[0.3em] text-spectrum-blue">One point at a time</span>
                            <span className="text-xl font-semibold tracking-tight">Point scanner</span>
                        </div>
                        <div className="flex gap-1.5">
                            <if when={list.contains(value: list.pluck(value: self.IlluminationState.illuminations, key: "is_active"), item: true)}>
                                <div className="flex items-center gap-1.5 rounded-full border border-spectrum-cyan/40 bg-spectrum-cyan/10 px-2.5 py-1 text-[11px] text-spectrum-cyan">
                                    <span className="size-1.5 animate-pulse rounded-full bg-spectrum-cyan shadow-[0_0_8px_2px] shadow-spectrum-cyan/60" />
                                    <span>Beam on</span>
                                </div>
                            <else>
                                <div className="flex items-center gap-1.5 rounded-full border border-border/60 bg-card/70 px-2.5 py-1 text-[11px] text-muted-foreground">
                                    <span className="size-1.5 rounded-full bg-muted-foreground/30" />
                                    <span>Beam off</span>
                                </div>
                            </else>
                            </if>
                            <if when={self.CameraState.is_acquiring}>
                                <div className="flex items-center gap-1.5 rounded-full bg-destructive/15 px-2.5 py-1 text-[11px] font-medium text-destructive">
                                    <span className="size-1.5 animate-pulse rounded-full bg-destructive" />
                                    <span>Scanning</span>
                                </div>
                            </if>
                        </div>
                    </div>

                    <foreach items={self.IlluminationState.illuminations} let="light" key={light.slot}>
                        <div className="relative overflow-hidden rounded-2xl border border-border/60 bg-card/70 shadow-xl">
                            <div className="relative h-[244px] w-full">
                                <ActionLogo viewBox="0 0 640 372" width="100%" height="100%" title="The beam path: out through the scanner, and back through it to the pinhole. Not to scale.">
                                    <!-- out: up from the laser, reflected by the dichroic, through the scanner to the sample -->
                                    <Rect x={143} y={196} width={66} height={48} rx={8} fill="muted" fillOpacity={0.14} stroke="muted" strokeOpacity={0.5} strokeWidth={1.5} />
                                    <SvgText x={176} y={227} text={fmt.number(value: light.wavelength, digits: 0)} textAnchor="middle" fill="ink" fontSize={18} fontWeight="600" />
                                    <Line x1={176} y1={196} x2={176} y2={58} stroke="spectrum-cyan" strokeWidth={4} opacity={light.is_active ? 1 : 0.15} />
                                    <Line x1={176} y1={58} x2={590} y2={58} stroke="spectrum-cyan" strokeWidth={4} opacity={light.is_active ? 1 : 0.15} />

                                    <!-- back: what the sample emits, the same way, straight through the dichroic -->
                                    <Line x1={70} y1={72} x2={590} y2={72} stroke="spectrum-green" strokeWidth={4} opacity={light.is_active ? 0.9 : 0.1} />

                                    <Rect x={8} y={42} width={62} height={46} rx={8} fill="spectrum-green" fillOpacity={0.14} stroke="spectrum-green" strokeOpacity={0.8} strokeWidth={1.5} />
                                    <SvgText x={39} y={72} text="PMT" textAnchor="middle" fill="spectrum-green" fontSize={18} fontWeight="600" />

                                    <Line x1={100} y1={30} x2={100} y2={62} stroke="ink" strokeWidth={5} strokeLinecap="round" />
                                    <Line x1={100} y1={82} x2={100} y2={114} stroke="ink" strokeWidth={5} strokeLinecap="round" />
                                    <SvgText x={100} y={140} text="pinhole" textAnchor="middle" fill="muted" fontSize={16} />
                                    <SvgText x={100} y={160} text="50 µm" textAnchor="middle" fill="muted" fontSize={16} />

                                    <Rect x={126} y={56} width={18} height={32} rx={3} fill="spectrum-green" fillOpacity={0.25} stroke="spectrum-green" strokeOpacity={0.8} strokeWidth={1.5} />
                                    <SvgText x={135} y={24} text="BP 525" textAnchor="middle" fill="muted" fontSize={16} />

                                    <Line x1={154} y1={94} x2={198} y2={36} stroke="ink" strokeWidth={4} strokeLinecap="round" />
                                    <SvgText x={206} y={108} text="dichroic" fill="muted" fontSize={16} />

                                    <Line x1={236} y1={40} x2={256} y2={90} stroke="spectrum-blue" strokeWidth={6} strokeLinecap="round" />
                                    <Line x1={266} y1={40} x2={286} y2={90} stroke="spectrum-blue" strokeWidth={6} strokeLinecap="round" />
                                    <SvgText x={261} y={24} text="galvo" textAnchor="middle" fill="spectrum-blue" fontSize={17} fontWeight="600" />

                                    <Ellipse cx={336} cy={65} rx={9} ry={36} fill="muted" fillOpacity={0.14} stroke="muted" strokeOpacity={0.7} strokeWidth={1.5} />
                                    <SvgText x={336} y={24} text="scan" textAnchor="middle" fill="muted" fontSize={16} />
                                    <Ellipse cx={402} cy={65} rx={10} ry={38} fill="muted" fillOpacity={0.14} stroke="muted" strokeOpacity={0.7} strokeWidth={1.5} />
                                    <SvgText x={402} y={24} text="tube" textAnchor="middle" fill="muted" fontSize={16} />

                                    <Polygon points="456,30 512,44 526,56 526,74 512,86 456,100" fill="muted" fillOpacity={0.18} stroke="muted" strokeOpacity={0.7} strokeWidth={1.5} />
                                    <SvgText x={490} y={24} text="NA 0.25" textAnchor="middle" fill="muted" fontSize={16} />

                                    <Rect x={590} y={26} width={18} height={78} rx={3} fill="spectrum-green" fillOpacity={0.3} stroke="spectrum-green" strokeOpacity={0.9} strokeWidth={1.5} />
                                    <SvgText x={599} y={124} text="sample" textAnchor="middle" fill="spectrum-green" fontSize={16} fontWeight="600" />

                                    <!-- what the scan does on the sample -->
                                    <G opacity={self.CameraState.is_acquiring ? 1 : 0.4}>
                                        <Rect x={448} y={142} width={166} height={166} rx={4} fill="spectrum-blue" fillOpacity={0.06} stroke="spectrum-blue" strokeOpacity={0.6} strokeWidth={1.5} />
                                        <Polyline points="460,158 602,158 460,180 602,180 460,202 602,202 460,224 602,224 460,246 602,246 460,268 602,268 460,290 602,290" fill="none" stroke="spectrum-cyan" strokeWidth={2} />
                                        <Circle cx={602} cy={290} r={6} fill="ink" />
                                    </G>
                                    <SvgText x={531} y={332} text="512 × 512, row by row" textAnchor="middle" fill="spectrum-blue" fontSize={16} />
                                    <SvgText x={20} y={332} text="Every pixel is a moment: the image" fill="muted" fontSize={16} />
                                    <SvgText x={20} y={354} text="only exists once the scan has passed." fill="muted" fontSize={16} />
                                </ActionLogo>
                            </div>
                            <div className="relative grid grid-cols-3 divide-x divide-border/50 border-t border-border/50">
                                <div className="flex flex-col px-3 py-2">
                                    <span className="text-[10px] uppercase tracking-wider text-muted-foreground">Per step</span>
                                    <span className="text-lg font-semibold tabular-nums text-spectrum-blue">0.02°</span>
                                </div>
                                <div className="flex flex-col px-3 py-2">
                                    <span className="text-[10px] uppercase tracking-wider text-muted-foreground">Pixel</span>
                                    <span className="text-lg font-semibold tabular-nums text-spectrum-blue">1.75 µm</span>
                                </div>
                                <div className="flex flex-col px-3 py-2">
                                    <span className="text-[10px] uppercase tracking-wider text-muted-foreground">Field</span>
                                    <span className="text-lg font-semibold tabular-nums text-spectrum-blue">893 µm</span>
                                </div>
                            </div>
                            <div className="relative border-t border-border/50 p-4">
                                <div className="flex items-center justify-between gap-3">
                                    <div className="flex flex-col">
                                        <span className="text-[10px] font-medium uppercase tracking-[0.2em] text-spectrum-cyan">{light.key} · beam power</span>
                                        <span className="text-3xl font-semibold tabular-nums tracking-tight">{fmt.percent(value: math.div(a: light.intensity, b: light.max_intensity))}</span>
                                    </div>
                                    <div className="past:pointer-events-none past:opacity-50">
                                        <if when={light.is_active}>
                                            <Switch checked={true} className="data-[state=checked]:bg-spectrum-cyan" onChange={self.turn_off_illumination_channel(channel: light.slot)} />
                                        <else>
                                            <Switch checked={false} onChange={self.turn_on_illumination(channel: light.slot)} />
                                        </else>
                                        </if>
                                    </div>
                                </div>
                                <Slider className="mt-3 past:hidden [&amp;_[data-slot=slider-range]]:bg-spectrum-cyan [&amp;_[data-slot=slider-thumb]]:border-spectrum-cyan" value={light.intensity} min={light.min_intensity} max={light.max_intensity} onCommit={self.set_illumination_intensity(intensity: event.value, channel: light.slot)} />
                            </div>
                        </div>
                    </foreach>

                    <foreach items={self.CameraState.detectors} let="pmt" key={pmt.slot}>
                        <div className="rounded-2xl border border-border/60 bg-card/70 p-4 shadow-xl">
                            <div className="flex items-start justify-between gap-3">
                                <div className="flex flex-col">
                                    <span className="text-[10px] font-medium uppercase tracking-[0.2em] text-muted-foreground">Dwell on each pixel</span>
                                    <div className="flex items-baseline gap-1.5">
                                        <span className="text-3xl font-semibold tabular-nums tracking-tight">{fmt.number(value: math.div(a: math.mul(a: pmt.current_exposure_time, b: 1000000), b: math.mul(a: pmt.width, b: pmt.height)), digits: 2)}</span>
                                        <span className="text-sm text-muted-foreground">µs</span>
                                    </div>
                                </div>
                                <div className="flex gap-1.5">
                                    <foreach items={pmt.axes} let="dim" key={dim.name}>
                                        <div className="flex min-w-14 flex-col rounded-lg bg-spectrum-blue/10 px-2 py-1">
                                            <span className="text-sm font-semibold text-spectrum-blue">{dim.name} · {dim.size}</span>
                                            <span className="truncate text-[10px] text-muted-foreground">from {dim.delivered_by}</span>
                                        </div>
                                    </foreach>
                                </div>
                            </div>
                            <div className="mt-3 grid grid-cols-2 gap-3 past:hidden">
                                <div className="flex min-w-0 flex-col gap-2 rounded-xl bg-muted/30 p-3">
                                    <span className="text-[10px] font-medium uppercase tracking-[0.2em] text-muted-foreground">Frame time</span>
                                    <div className="flex items-baseline gap-1">
                                        <span className="text-xl font-semibold tabular-nums">{fmt.number(value: math.mul(a: pmt.current_exposure_time, b: 1000), digits: 0)}</span>
                                        <span className="text-xs text-muted-foreground">ms</span>
                                    </div>
                                    <Slider className="min-w-0" step={10} value={math.mul(a: pmt.current_exposure_time, b: 1000)} min={10} max={2000} onCommit={self.update_detector(slot: pmt.slot, exposure_time: math.div(a: event.value, b: 1000))} />
                                </div>
                                <div className="flex min-w-0 flex-col gap-2 rounded-xl bg-muted/30 p-3">
                                    <span className="text-[10px] font-medium uppercase tracking-[0.2em] text-muted-foreground">Gain</span>
                                    <div className="flex items-baseline gap-1">
                                        <span className="text-xl font-semibold tabular-nums">{fmt.number(value: pmt.current_gain, digits: 1)}</span>
                                        <span className="text-xs text-muted-foreground">dB</span>
                                    </div>
                                    <Slider className="min-w-0" step={0.1} value={pmt.current_gain} min={pmt.min_gain} max={pmt.max_gain} onCommit={self.update_detector(slot: pmt.slot, gain: event.value)} />
                                </div>
                            </div>
                            <span className="mt-2 block text-[11px] text-muted-foreground">A longer frame collects more light per pixel, and scans slower.</span>
                        </div>
                    </foreach>

                    <div className="rounded-2xl border border-border/60 bg-card/70 p-4 shadow-xl">
                        <div className="flex items-start justify-between gap-3">
                            <div className="flex flex-col">
                                <span className="text-[10px] font-medium uppercase tracking-[0.2em] text-muted-foreground">Focus</span>
                                <div className="flex items-baseline gap-1.5">
                                    <span className="text-3xl font-semibold tabular-nums tracking-tight">{fmt.number(value: self.StageState.z, digits: 1)}</span>
                                    <span className="text-sm text-muted-foreground">µm</span>
                                </div>
                            </div>
                            <if when={math.abs(value: self.StageState.z) < 3.5}>
                                <div className="flex items-center gap-1.5 rounded-full bg-spectrum-green/15 px-2.5 py-1 text-[11px] font-medium text-spectrum-green">
                                    <span className="size-1.5 rounded-full bg-spectrum-green" />
                                    <span>Sharp</span>
                                </div>
                            <else>
                                <if when={math.abs(value: self.StageState.z) < 14}>
                                    <div className="flex items-center gap-1.5 rounded-full bg-warning/15 px-2.5 py-1 text-[11px] font-medium text-warning">
                                        <span className="size-1.5 rounded-full bg-warning" />
                                        <span>Softening</span>
                                    </div>
                                <else>
                                    <div className="flex items-center gap-1.5 rounded-full bg-destructive/15 px-2.5 py-1 text-[11px] font-medium text-destructive">
                                        <span className="size-1.5 rounded-full bg-destructive" />
                                        <span>Out of focus</span>
                                    </div>
                                </else>
                                </if>
                            </else>
                            </if>
                        </div>
                        <Slider className="mt-3 past:hidden [&amp;_[data-slot=slider-range]]:bg-spectrum-green [&amp;_[data-slot=slider-thumb]]:border-spectrum-green" step={1} value={self.StageState.z} min={-50} max={50} onCommit={self.move_stage(z: event.value, is_absolute: true)} />
                        <div className="mt-3 grid grid-cols-5 gap-1.5 past:hidden">
                            <Button size="sm" variant="outline" onClick={self.move_stage(z: -10.0)}>-10</Button>
                            <Button size="sm" variant="outline" onClick={self.move_stage(z: -1.0)}>-1</Button>
                            <Button size="sm" variant="secondary" onClick={self.move_stage(z: 0.0, is_absolute: true)}>0</Button>
                            <Button size="sm" variant="outline" onClick={self.move_stage(z: 1.0)}>+1</Button>
                            <Button size="sm" variant="outline" onClick={self.move_stage(z: 10.0)}>+10</Button>
                        </div>
                        <span className="mt-2 block text-[11px] text-muted-foreground">The simulated sample is flat, so moving z only blurs it: the pinhole does not reject light yet.</span>
                    </div>
                </div>
            </ScrollArea>
        </div>
        </Html>
    view-stack:
      description: 'Stack: frames through z, stored in mikro.'
      bsx: |
        <Html>
        <div className="flex h-full w-full flex-col gap-3 overflow-auto bg-gradient-to-bl from-spectrum-blue/10 via-transparent to-spectrum-green/5 p-4">
            <div className="rounded-2xl border border-spectrum-blue/30 bg-card/70 p-4 shadow-xl">
                <span className="text-[10px] font-medium uppercase tracking-[0.3em] text-spectrum-blue">Frame by frame</span>
                <span className="mt-2 block text-sm">The scan delivers y and x. Everything else is stepped here: the stage moves between frames, so plane spacing is yours to choose.</span>
                <span className="mt-1 block text-xs text-muted-foreground">Turn the beam on first if a stack should use its current power; set Step to space the planes evenly.</span>
            </div>
            <MultidimensionalAcquisitionControl />
        </div>
        </Html>
    view-stage:
      description: 'Stage: where the sample is, with the frames taken there.'
      bsx: |
        <Html>
        <Resizable direction="row" className="h-full w-full">
            <ResizablePanel defaultSize={70}>
                <div className="flex h-full flex-col overflow-hidden bg-muted/30">
                    <StageView className="flex-1">
                        <StageScene>
                            <StageAxis />
                            <StagePlane />
                            <FramesLayer />
                            <ImagesLayer />
                            <LivesLayer />
                            <FrameLightPathLayer />
                            <StagePositioner />
                            <RectangleDrawer />
                        </StageScene>
                        <ScanRegionPanel />
                        <ImageMetadataPanel />
                        <FramePanel />
                        <SceneOverlay />
                    </StageView>
                </div>
            </ResizablePanel>
            <ResizableHandle withHandle={true} />
            <ResizablePanel defaultSize={30} minSize={20} maxSize={45}>
                <ScrollArea className="h-full">
                    <div className="flex flex-col gap-4 p-4 past:opacity-70 past:grayscale">
                        <StageControl className="locked:opacity-60" />
                        <CameraControl className="locked:opacity-60" />
                    </div>
                </ScrollArea>
            </ResizablePanel>
        </Resizable>
        </Html>
