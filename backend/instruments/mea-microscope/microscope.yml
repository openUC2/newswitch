# Cells grown on a multi-electrode array, imaged from above while the array records their voltage.
#
#   laser_488 -> dichroic -> objective -> stage (GFP cells on an mea-60 chip) -> camera
#   white_led -> condenser -> stage ----------------------------------------> camera
#   mea: the chip's 8 x 8 electrodes, 20 kHz, read in blocks of 50 ms
#
# The chip is the holder: its electrodes are places of the sample (electrode:stage:D5), as a
# plate's wells are, so they move with how it is mounted and no stage move finds them. The cells are
# the beads the camera draws: they fire at random, and each electrode picks up those near it.
# Mount the slide instead (mount_holder) and the array reads nothing: it has no electrodes.
#
# Run it:      NEWSWITCH_CONFIG=instruments/mea-microscope just dev-mikro

spec: newswitch/instrument/v0
name: mea-microscope

cubes:
  laser_488:
    element: {kind: source, emits: laser, spectrum: {center: 488 nm, width: 2 nm}, max_power: 50 mW}
    tunes:
      power: {actuator: laser-dac, initial: 0 mW, step: 1 mW, max: 50 mW}

  white_led:
    element: {kind: source, emits: led, spectrum: {center: 540 nm, width: 500 nm}, max_power: 5 mW}
    tunes:
      power: {actuator: led-dac, initial: 10 uW, step: 1 uW, max: 5 mW}

  condenser:
    element: {kind: lens, f: 20 mm, na: 0.4, immersion: air}

  stage:
    element:
      kind: sample
      simulation: firing-cells
      simulations:
        firing-cells:
          fluorophore: egfp
          absorbed: 1.0e-4
          transmit: 0.9
          reflect: 1.0e-6
          pattern: {beads: 600, radius: 6 um, depth: 10 um, extent: 2 mm}
          # as cells: each fires 3 times a second; an electrode 40 um away picks up 1/e of 150 uV
          electrical: {rate: 3 Hz, amplitude: 150, reach: 40 um}
      holders:
        mea: {holder: mea-60, mount: {x: -24.5 mm, y: -24.5 mm}}       # its middle on the stage's 0
        slide: {holder: slide-75x25, mount: {x: -37.5 mm, y: -12.5 mm}}
      mounted: mea
    moves:
      x: {actuator: a-x, along: x, initial: 0 um, step: 10 um, min: -5000 um, max: 5000 um, speed: 5000 um/s}
      y: {actuator: a-y, along: y, initial: 0 um, step: 10 um, min: -5000 um, max: 5000 um, speed: 5000 um/s}
      z: {actuator: a-z, along: axis, initial: 0 um, step: 1 um, min: -500 um, max: 500 um, speed: 500 um/s}

  objective:
    element: {kind: lens, name: 10x NA 0.25, f: 20 mm, na: 0.25, immersion: air, magnification: 10, working_distance: 10 mm}

  dichroic:
    element: {kind: dichroic, curve: lp_500}

  filter:
    element: {kind: filter, name: BP 525/50, curve: bp_525_50}

  tube:
    element: {kind: lens, f: 200 mm}

  camera:
    element:
      kind: sensor
      axes: {x: {size: 512, pitch: 6.5 um}, y: {size: 512, pitch: 6.5 um}}
      readout: scmos
    tunes:
      frame_rate: {initial: 30 Hz, min: 1 Hz, max: 100 Hz, step: 1 Hz}
      exposure: {initial: 100 ms, step: 10 ms, min: 1 ms, max: 10 s}
      gain: {initial: 0 dB, step: 1 dB, min: 0 dB, max: 40 dB}
      binning: {initial: 1, min: 1, max: 4, step: 1}

  # The array: what the chip mounted on the stage has as electrodes, in microvolts.
  mea:
    element:
      kind: probe
      measures: {quantity: voltage, unit: uV}
      reads: {grid: electrode}
      sampling: {rate: 20 kHz, block: 50 ms}
      model: {kind: spikes, noise: 5}   # in its unit: uV

illumination:
  - {from: laser_488, to: dichroic}
  - {from: dichroic, via: reflect, to: objective}
  - {from: objective, to: stage, side: epi, field: 500 um}
  - {from: white_led, to: condenser}
  - {from: condenser, to: stage, side: transmitted, field: 2 mm}

detection:
  - {from: stage, to: objective, distance: focus}
  - {from: objective, to: dichroic, distance: 100 mm}
  - {from: dichroic, via: transmit, to: filter, distance: 30 mm}
  - {from: filter, to: tube, distance: 30 mm}
  - {from: tube, to: camera, distance: focus}

# Example wiring: no rig stands behind this file, and the board, axes and steps_per_um are made up.
# `simulate: everything` below never builds it; for a real rig, state what is really there.
hardware:
  boards:
    uc2: {transport: canopen, interface: socketcan, channel: can0}
  actuators:
    a-x: {driver: uc2.stepper, board: uc2, axis: X, steps_per_um: 3.2}
    a-y: {driver: uc2.stepper, board: uc2, axis: Y, steps_per_um: 3.2}
    a-z: {driver: uc2.stepper, board: uc2, axis: Z, steps_per_um: 3.2}
    laser-dac: {driver: uc2.laser, board: uc2, channel: 1, pwm_max: 1023}
    led-dac: {driver: uc2.laser, board: uc2, channel: 2, pwm_max: 1023}

settings:
  simulate: everything
  db_path: arkitekt_agent.db
  image_dir: /tmp/newswitch/images
  cache_dir: /tmp/newswitch/cache
  camera_recording_dir: data/recordings
  camera_debug_window: false

ui:
  catalog: newswitch@10
  bloks:
    view-mea:
      description: 'Cells on an electrode array: the camera beside what each electrode picks up.'
      default: true
      file: view.bsx
    view-stage:
      description: 'Stage: the chip, its electrodes, and the images taken there.'
      file: ../views/stage.bsx
    view-acquire:
      description: 'Acquire: images and voltages of the cells, stored in mikro.'
      file: ../views/acquire.bsx
    view-minimal:
      description: 'Minimal: the live image and the stage, nothing else.'
      file: ../views/minimal.bsx
