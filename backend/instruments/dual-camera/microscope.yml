# Two cameras, each behind a filter of its own, seeing the sample at once: a splitter sends the
# emission down two arms. The reflected arm's image comes out mirrored; an acquisition turns it back
# when it merges the two (`routines.acquire`).
#
# Run it:      NEWSWITCH_CONFIG=instruments/dual-camera just dev-mikro

spec: newswitch/instrument/v0
name: dual-camera

cubes:
  laser_488:
    element: {kind: source, emits: laser, spectrum: {center: 488 nm, width: 2 nm}, max_power: 50 mW}
    tunes:
      power: {actuator: laser-dac, initial: 0 mW, step: 1 mW, max: 50 mW}

  led_625:
    element: {kind: source, emits: led, spectrum: {center: 625 nm, width: 15 nm}, max_power: 50 nW}
    tunes:
      power: {actuator: led-dac, initial: 0 mW, step: 5 nW, max: 50 nW}

  stage:
    element:
      kind: sample
      simulation: gfp-beads
      simulations:   # what can be on it; simulation: says which is
        gfp-beads:
          fluorophore: egfp
          absorbed: 1.0e-4
          transmit: 0.9   # light going straight through (transmitted light)
          reflect: 1.0e-6  # light coming back the way it came (epi)
          pattern: {beads: 3600, radius: 2 um, depth: 4 um}
        empty-slide:
          transmit: 0.95
          reflect: 1.0e-6
          pattern: {beads: 0, radius: 2 um, depth: 4 um}
    moves:
      x: {actuator: stg-x, along: x, initial: 0 um, step: 10 um, min: -5000 um, max: 5000 um, speed: 5000 um/s}
      y: {actuator: stg-y, along: y, initial: 0 um, step: 10 um, min: -5000 um, max: 5000 um, speed: 5000 um/s}
      z: {actuator: stg-z, along: axis, initial: 0 um, step: 100 um, min: -500 um, max: 500 um, speed: 500 um/s}

  objective:
    element: {kind: lens, name: f20 NA 0.25, f: 20 mm, na: 0.25, immersion: air, working_distance: 10 mm}

  dichroic:
    element: {kind: dichroic, curve: lp_500}

  splitter:
    element: {kind: splitter, reflect: 0.5, transmit: 0.5}

  filter_green:
    element: {kind: filter, name: BP 525/50, curve: bp_525_50}

  tube_green:
    element: {kind: lens, f: 200 mm}

  camera_green:
    element:
      kind: sensor
      axes: {x: {size: 512, pitch: 6.5 um}, y: {size: 512, pitch: 6.5 um}}
      readout: scmos
    tunes:
      frame_rate: {initial: 30 Hz, min: 1 Hz, max: 100 Hz, step: 1 Hz}
      exposure: {initial: 100 ms, step: 10 ms, min: 1 ms, max: 10 s}
      gain: {initial: 0 dB, step: 1 dB, min: 0 dB, max: 40 dB}
      binning: {initial: 1, min: 1, max: 4, step: 1}

  filter_red:
    element: {kind: filter, name: BP 625/50, curve: bp_625_50}

  tube_red:
    element: {kind: lens, f: 200 mm}

  camera_red:
    element:
      kind: sensor
      axes: {x: {size: 512, pitch: 6.5 um}, y: {size: 512, pitch: 6.5 um}}
      readout: scmos
    tunes:
      frame_rate: {initial: 30 Hz, min: 1 Hz, max: 100 Hz, step: 1 Hz}
      exposure: {initial: 100 ms, step: 10 ms, min: 1 ms, max: 10 s}
      gain: {initial: 0 dB, step: 1 dB, min: 0 dB, max: 40 dB}
      binning: {initial: 1, min: 1, max: 4, step: 1}

illumination:
  - {from: laser_488, to: dichroic}
  - {from: dichroic, via: reflect, to: objective}
  - {from: objective, to: stage, side: epi, field: 500 um}
  - {from: led_625, to: stage, side: transmitted, field: 500 um}

detection:
  - {from: stage, to: objective, distance: focus}
  - {from: objective, to: dichroic, distance: 100 mm}
  - {from: dichroic, via: transmit, to: splitter, distance: 30 mm}
  - {from: splitter, via: transmit, to: filter_green, distance: 30 mm}
  - {from: filter_green, to: tube_green, distance: 30 mm}
  - {from: tube_green, to: camera_green, distance: focus}
  - {from: splitter, via: reflect, to: filter_red, distance: 30 mm}
  - {from: filter_red, to: tube_red, distance: 30 mm}
  - {from: tube_red, to: camera_red, distance: focus}

# Example wiring: no rig stands behind this file, and the board, axes and steps_per_um are made up.
# `simulate: everything` below never builds it; for a real rig, state what is really there.
hardware:
  boards:
    uc2: {transport: canopen, interface: socketcan, channel: can0}
  actuators:
    stg-x: {driver: uc2.stepper, board: uc2, axis: X, steps_per_um: 3.2}
    stg-y: {driver: uc2.stepper, board: uc2, axis: Y, steps_per_um: 3.2}
    stg-z: {driver: uc2.stepper, board: uc2, axis: Z, steps_per_um: 3.2}
    laser-dac: {driver: uc2.laser, board: uc2, channel: 1, pwm_max: 1023}
    led-dac: {driver: uc2.laser, board: uc2, channel: 2, pwm_max: 1023}

settings:
  simulate: everything
  db_path: arkitekt_agent.db
  image_dir: /tmp/newswitch/images
  cache_dir: /tmp/newswitch/cache
  camera_recording_dir: data/recordings
  camera_debug_window: false

ui:
  catalog: newswitch@10
  bloks:
    view-dual:
      description: 'Dual: both cameras side by side, and what each sees.'
      default: true
      file: view.bsx
    view-fluorescence:
      description: 'Fluorescence: excitation, emission and detection, built from blok primitives.'
      file: ../views/fluorescence.bsx
    view-acquire:
      description: 'Acquire: time, positions, z planes and detectors, stored in mikro.'
      file: ../views/acquire.bsx
    view-stage:
      description: 'Stage: the sample on the stage, with the images taken there.'
      file: ../views/stage.bsx
    view-minimal:
      description: 'Minimal: the live image and the stage, nothing else.'
      file: ../views/minimal.bsx
agent_ui:
  bloks:
    view-microscope:
      description: 'Microscope: drive the stage on its map or with the pad, and run the cameras, lights and optics.'
      default: true
      file: ../views/agent-microscope.bsx
