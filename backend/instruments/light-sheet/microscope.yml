# A light sheet: a lens lights one thin plane from the side, and a camera looks at it from above.
# Two things move along z. Each frame of the camera steps the sheet, so the camera delivers z and an
# acquisition takes a stack as one sweep. The stage is separate: it carries the sample through the
# sheet in x, y and z, and all of it stays as sharp. Only where the sheet is from the objective's focus
# decides how sharp a plane is, so that is found to be what focuses. See `drives`.
# Simulated only: no camera is triggered on real hardware yet.
#
# Run it:      NEWSWITCH_CONFIG=instruments/light-sheet just dev

spec: newswitch/instrument/v0
name: light-sheet

cubes:
  laser_488:
    element: {kind: source, emits: laser, spectrum: {center: 488 nm, width: 2 nm}, max_power: 50 mW}
    tunes:
      power: {actuator: laser-dac, initial: 5 mW, step: 1 mW, max: 50 mW}   # on from the start: a sheet only shows when lit

  sheet_lens:
    element: {kind: lens, name: sheet NA 0.02, f: 50 mm, na: 0.02, immersion: air}
    signals:
      in: [z]   # the sheet takes a step per pulse
    moves:
      # No actuator: no driver here positions a sheet, and a board's fourth axis steps no stepper.
      z: {along: axis, initial: 0 um, step: 0.5 um, min: -100 um, max: 100 um, speed: 2000 um/s}

  stage:
    element:
      kind: sample
      depth: 200 um  # a volume: where in it the light lands is what is seen
      simulation: gfp-beads
      simulations:   # what can be on it; simulation: says which is
        gfp-beads:
          fluorophore: egfp
          absorbed: 3.0e-6
          transmit: 0.9   # light going straight through (transmitted light)
          reflect: 1.0e-6  # light coming back the way it came (epi)
          pattern: {beads: 200000, radius: 1 um, depth: 200 um}
        gfp-section:   # a thin section: it leaves the sheet, rather than the sheet moving through it
          fluorophore: egfp
          absorbed: 1.0e-4
          transmit: 0.9
          reflect: 1.0e-6
          pattern: {beads: 3600, radius: 10 um, depth: 4 um}
        empty-slide:
          transmit: 0.95
          reflect: 1.0e-6
          pattern: {beads: 0, radius: 10 um, depth: 4 um}
    moves:
      x: {actuator: stg-x, along: x, initial: 0 um, step: 10 um, min: -5000 um, max: 5000 um, speed: 5000 um/s}
      y: {actuator: stg-y, along: y, initial: 0 um, step: 10 um, min: -5000 um, max: 5000 um, speed: 5000 um/s}
      z: {actuator: stg-z, along: axis, initial: 0 um, step: 5 um, min: -500 um, max: 500 um, speed: 500 um/s}

  objective:
    element: {kind: lens, name: f20 NA 0.25, f: 20 mm, na: 0.25, immersion: air, working_distance: 10 mm}

  filter_green:
    element: {kind: filter, name: BP 525/50, curve: bp_525_50}

  tube:
    element: {kind: lens, f: 200 mm}

  camera:
    component: generic-camera-512
    tunes:
      frame_rate: {initial: 30 Hz, min: 1 Hz, max: 100 Hz, step: 1 Hz}
      exposure: {initial: 100 ms, step: 10 ms, min: 1 ms, max: 10 s}
      gain: {initial: 0 dB, step: 1 dB, min: 0 dB, max: 40 dB}
      binning: {initial: 1, min: 1, max: 4, step: 1}

illumination:
  - {from: laser_488, to: sheet_lens}
  - {from: sheet_lens, to: stage, side: orthogonal, along: x, field: 500 um}   # it travels along the image's x

detection:
  - {from: stage, to: objective, distance: focus}
  - {from: objective, to: filter_green, distance: 100 mm}
  - {from: filter_green, to: tube, distance: 30 mm}
  - {from: tube, to: camera, distance: focus}

drives:
  - {from: camera.frame, to: sheet_lens.z, by: 0.5 um}

# Example wiring: no rig stands behind this file, and the board, axes and steps_per_um are made up.
# `simulate: everything` below never builds it; for a real rig, state what is really there.
hardware:
  boards:
    uc2: {transport: canopen, interface: socketcan, channel: can0}
  actuators:
    stg-x: {driver: uc2.stepper, board: uc2, axis: X, steps_per_um: 3.2}
    stg-y: {driver: uc2.stepper, board: uc2, axis: Y, steps_per_um: 3.2}
    stg-z: {driver: uc2.stepper, board: uc2, axis: Z, steps_per_um: 3.2}
    laser-dac: {driver: uc2.laser, board: uc2, channel: 1, pwm_max: 1023}

settings:
  simulate: everything
  db_path: arkitekt_agent.db
  image_dir: /tmp/newswitch/images
  cache_dir: /tmp/newswitch/cache
  calibration_dir: data/calibration
  camera_recording_dir: data/recordings
  camera_debug_window: false

ui:
  catalog: newswitch@10
  bloks:
    view-sheet:
      description: 'Sheet: the sheet through the sample, the live plane, and where z is.'
      default: true
      bsx: |
        <Blok kind="agent" context="panel" catalog="newswitch">
        <div className="flex h-full w-full gap-3 overflow-hidden bg-gradient-to-br from-spectrum-cyan/10 via-transparent to-spectrum-green/5 p-3">
            <ScrollArea className="h-full w-[430px] shrink-0">
                <div className="flex flex-col gap-3 pb-3 pr-3">

                    <div className="flex items-center justify-between px-1 pt-1">
                        <div className="flex flex-col">
                            <span className="text-[10px] font-medium uppercase tracking-[0.3em] text-spectrum-cyan">Selective plane</span>
                            <span className="text-xl font-semibold tracking-tight">Light sheet</span>
                        </div>
                        <div className="flex gap-1.5">
                            <if when={list.contains(value: list.pluck(value: obj.values(value: self.SourceState.sources), key: "on"), item: true)}>
                                <div className="flex items-center gap-1.5 rounded-full border border-spectrum-cyan/40 bg-spectrum-cyan/10 px-2.5 py-1 text-[11px] text-spectrum-cyan">
                                    <span className="size-1.5 animate-pulse rounded-full bg-spectrum-cyan shadow-[0_0_8px_2px] shadow-spectrum-cyan/60" />
                                    <span>Sheet on</span>
                                </div>
                            <else>
                                <div className="flex items-center gap-1.5 rounded-full border border-border/60 bg-card/70 px-2.5 py-1 text-[11px] text-muted-foreground">
                                    <span className="size-1.5 rounded-full bg-muted-foreground/30" />
                                    <span>Sheet off</span>
                                </div>
                            </else>
                            </if>
                            <if when={self.DetectorState.is_acquiring}>
                                <div className="flex items-center gap-1.5 rounded-full bg-destructive/15 px-2.5 py-1 text-[11px] font-medium text-destructive">
                                    <span className="size-1.5 animate-pulse rounded-full bg-destructive" />
                                    <span>Live</span>
                                </div>
                            </if>
                        </div>
                    </div>

                    <foreach items={obj.values(value: self.SourceState.sources)} let="light" key={light.name}>
                        <div className="relative overflow-hidden rounded-2xl border border-border/60 bg-card/70 shadow-xl">
                            <div className={light.on ? "pointer-events-none absolute left-1/2 top-1/3 size-56 -translate-x-1/2 -translate-y-1/2 rounded-full bg-spectrum-cyan/15 blur-3xl" : "hidden"} />
                            <div className="relative h-[262px] w-full">
                                <Logo viewBox="0 0 580 340" width="100%" height="100%" title="The light sheet from the side, not to scale">
                                    <!-- the detection objective, looking down at the plane -->
                                    <Polygon points="272,14 368,14 368,66 346,104 294,104 272,66" fill="muted" fillOpacity={0.14} stroke="muted" strokeOpacity={0.5} strokeWidth={1.5} />
                                    <Line x1={320} y1={2} x2={320} y2={14} stroke="spectrum-green" strokeWidth={2} strokeDasharray="4 4" />
                                    <SvgText x={380} y={46} text="detection" fill="muted" fontSize={18} />
                                    <SvgText x={380} y={70} text={str.concat(values: ["NA ", self.OpticsState.elements.objective.facts.na])} fill="muted" fontSize={18} fontWeight="600" />

                                    <!-- what the plane emits, gathered by the objective -->
                                    <Polygon points="320,190 294,104 346,104" fill="spectrum-green" fillOpacity={light.on ? 0.32 : 0.04} />

                                    <!-- the laser, its lens and the sheet they make -->
                                    <Rect x={10} y={168} width={62} height={44} rx={8} fill="muted" fillOpacity={0.14} stroke="muted" strokeOpacity={0.5} strokeWidth={1.5} />
                                    <SvgText x={41} y={195} text={fmt.number(value: light.wavelength, digits: 0)} textAnchor="middle" fill="muted" fontSize={18} fontWeight="600" />
                                    <Line x1={72} y1={190} x2={104} y2={190} stroke="spectrum-cyan" strokeWidth={3} strokeDasharray="6 5" opacity={light.on ? 1 : 0.2} />
                                    <Ellipse cx={116} cy={190} rx={11} ry={50} fill="muted" fillOpacity={0.14} stroke="muted" strokeOpacity={0.6} strokeWidth={1.5} />

                                    <!-- the sample, where the stage has it -->
                                    <Rect x={214} y={math.clamp(value: math.add(a: 136, b: self.MoveState.moves.stage.z.current), min: 112, max: 180)} width={212} height={108} rx={4} fill="spectrum-green" fillOpacity={0.08} stroke="spectrum-green" strokeOpacity={0.6} strokeWidth={1.5} />
                                    <SvgText x={232} y={math.clamp(value: math.add(a: 158, b: self.MoveState.moves.stage.z.current), min: 134, max: 202)} text="sample" fill="spectrum-green" fontSize={16} fontWeight="600" />

                                    <!-- where the objective focuses, which stays -->
                                    <Line x1={128} y1={190} x2={522} y2={190} stroke="spectrum-green" strokeWidth={1.5} strokeDasharray="4 6" />
                                    <SvgText x={536} y={196} text="focus" fill="spectrum-green" fontSize={16} />

                                    <!-- the sheet, where its positioner has it -->
                                    <G opacity={light.on ? 1 : 0.12}>
                                        <Rect x={128} y={math.clamp(value: math.add(a: 180, b: math.mul(a: self.MoveState.moves.sheet_lens.z.current, b: 2)), min: 112, max: 250)} width={394} height={20} rx={10} fill="spectrum-cyan" fillOpacity={0.25} />
                                        <Rect x={128} y={math.clamp(value: math.add(a: 187, b: math.mul(a: self.MoveState.moves.sheet_lens.z.current, b: 2)), min: 119, max: 257)} width={394} height={6} rx={3} fill="spectrum-cyan" fillOpacity={0.85} />
                                    </G>
                                    <SvgText x={536} y={math.clamp(value: math.add(a: 170, b: math.mul(a: self.MoveState.moves.sheet_lens.z.current, b: 2)), min: 120, max: 170)} text="sheet" fill="spectrum-cyan" fontSize={16} />

                                    <!-- what the field sees of the sheet, and how far the sheet holds -->
                                    <Line x1={254} y1={266} x2={386} y2={266} stroke="spectrum-green" strokeWidth={2} />
                                    <Line x1={254} y1={260} x2={254} y2={272} stroke="spectrum-green" strokeWidth={2} />
                                    <Line x1={386} y1={260} x2={386} y2={272} stroke="spectrum-green" strokeWidth={2} />
                                    <SvgText x={320} y={258} text={str.concat(values: ["field ", fmt.number(value: self.OpticsState.detectors.camera.field_width_um, digits: 0), " µm"])} textAnchor="middle" fill="spectrum-green" fontSize={17} />
                                    <Line x1={165} y1={306} x2={475} y2={306} stroke="spectrum-cyan" strokeWidth={2} />
                                    <Line x1={165} y1={300} x2={165} y2={312} stroke="spectrum-cyan" strokeWidth={2} />
                                    <Line x1={475} y1={300} x2={475} y2={312} stroke="spectrum-cyan" strokeWidth={2} />
                                    <SvgText x={320} y={330} text={str.concat(values: ["stays thin for ±", fmt.number(value: self.OpticsState.sources.laser_488.reach_um, digits: 0), " µm"])} textAnchor="middle" fill="spectrum-cyan" fontSize={17} />
                                </Logo>
                            </div>
                            <div className="relative grid grid-cols-3 divide-x divide-border/50 border-t border-border/50">
                                <div className="flex flex-col px-3 py-2">
                                    <span className="text-[10px] uppercase tracking-wider text-muted-foreground">Waist</span>
                                    <span className="text-lg font-semibold tabular-nums text-spectrum-cyan">{fmt.number(value: math.div(a: self.OpticsState.sources.laser_488.thickness_um, b: 2), digits: 1)} µm</span>
                                </div>
                                <div className="flex flex-col px-3 py-2">
                                    <span className="text-[10px] uppercase tracking-wider text-muted-foreground">Rayleigh</span>
                                    <span className="text-lg font-semibold tabular-nums text-spectrum-cyan">{fmt.number(value: self.OpticsState.sources.laser_488.reach_um, digits: 0)} µm</span>
                                </div>
                                <div className="flex flex-col px-3 py-2">
                                    <span className="text-[10px] uppercase tracking-wider text-muted-foreground">Edge of field</span>
                                    <span className="text-lg font-semibold tabular-nums text-spectrum-green">{fmt.percent(value: self.OpticsState.sources.laser_488.edge_share)}</span>
                                </div>
                            </div>
                            <div className="relative border-t border-border/50 p-4">
                                <div className="flex items-center justify-between gap-3">
                                    <div className="flex flex-col">
                                        <span className="text-[10px] font-medium uppercase tracking-[0.2em] text-spectrum-cyan">{light.name} · sheet power</span>
                                        <span className="text-3xl font-semibold tabular-nums tracking-tight">{fmt.percent(value: math.div(a: light.power, b: light.max_power))}</span>
                                    </div>
                                    <div className="past:pointer-events-none past:opacity-50">
                                        <if when={light.on}>
                                            <Switch checked={true} className="data-[state=checked]:bg-spectrum-cyan" onChange={self.tune(name: light.power_variable, to: 0)} />
                                        <else>
                                            <Switch checked={false} onChange={self.tune(name: light.power_variable, to: light.lit_power)} />
                                        </else>
                                        </if>
                                    </div>
                                </div>
                                <Slider className="mt-3 past:hidden [&amp;_[data-slot=slider-range]]:bg-spectrum-cyan [&amp;_[data-slot=slider-thumb]]:border-spectrum-cyan" value={light.power} min={0} max={light.max_power} onCommit={self.tune(name: light.power_variable, to: event.value)} />
                            </div>
                        </div>
                    </foreach>

                    <div className="rounded-2xl border border-border/60 bg-card/70 p-4 shadow-xl">
                        <div className="flex items-start justify-between gap-3">
                            <div className="flex flex-col">
                                <span className="text-[10px] font-medium uppercase tracking-[0.2em] text-muted-foreground">Sheet z, stepped by the camera</span>
                                <div className="flex items-baseline gap-1.5">
                                    <span className="text-3xl font-semibold tabular-nums tracking-tight">{fmt.number(value: self.MoveState.moves.sheet_lens.z.current, digits: 1)}</span>
                                    <span className="text-sm text-muted-foreground">µm</span>
                                </div>
                            </div>
                            <if when={math.abs(value: self.OpticsState.detectors.camera.defocus_um) < math.div(a: math.div(a: self.OpticsState.sources.laser_488.thickness_um, b: 2), b: 2)}>
                                <div className="flex items-center gap-1.5 rounded-full bg-spectrum-green/15 px-2.5 py-1 text-[11px] font-medium text-spectrum-green">
                                    <span className="size-1.5 rounded-full bg-spectrum-green" />
                                    <span>In focus</span>
                                </div>
                            <else>
                                <if when={math.abs(value: self.OpticsState.detectors.camera.defocus_um) < math.div(a: self.OpticsState.sources.laser_488.thickness_um, b: 2)}>
                                    <div className="flex items-center gap-1.5 rounded-full bg-warning/15 px-2.5 py-1 text-[11px] font-medium text-warning">
                                        <span className="size-1.5 rounded-full bg-warning" />
                                        <span>Leaving focus</span>
                                    </div>
                                <else>
                                    <div className="flex items-center gap-1.5 rounded-full bg-destructive/15 px-2.5 py-1 text-[11px] font-medium text-destructive">
                                        <span className="size-1.5 rounded-full bg-destructive" />
                                        <span>Out of focus</span>
                                    </div>
                                </else>
                                </if>
                            </else>
                            </if>
                        </div>
                        <Slider className="mt-3 past:hidden [&amp;_[data-slot=slider-range]]:bg-spectrum-cyan [&amp;_[data-slot=slider-thumb]]:border-spectrum-cyan" step={0.5} value={self.MoveState.moves.sheet_lens.z.current} min={-60} max={60} onCommit={self.move_one(name: "sheet_lens.z", to: event.value)} />
                        <div className="mt-3 grid grid-cols-5 gap-1.5 past:hidden">
                            <Button size="sm" variant="outline" onClick={self.move_one(name: "sheet_lens.z", by: -5.0)}>-5</Button>
                            <Button size="sm" variant="outline" onClick={self.move_one(name: "sheet_lens.z", by: -0.5)}>-0.5</Button>
                            <Button size="sm" variant="secondary" onClick={self.move_one(name: "sheet_lens.z", to: 0.0)}>0</Button>
                            <Button size="sm" variant="outline" onClick={self.move_one(name: "sheet_lens.z", by: 0.5)}>+0.5</Button>
                            <Button size="sm" variant="outline" onClick={self.move_one(name: "sheet_lens.z", by: 5.0)}>+5</Button>
                        </div>
                        <span className="mt-2 block text-[11px] text-muted-foreground">Lights another plane, and how far it is from the objective's focus says how sharp that plane is.</span>
                    </div>

                    <div className="rounded-2xl border border-border/60 bg-card/70 p-4 shadow-xl">
                        <div className="flex flex-col">
                            <span className="text-[10px] font-medium uppercase tracking-[0.2em] text-muted-foreground">Stage z, through the sample</span>
                            <div className="flex items-baseline gap-1.5">
                                <span className="text-3xl font-semibold tabular-nums tracking-tight">{fmt.number(value: self.MoveState.moves.stage.z.current, digits: 1)}</span>
                                <span className="text-sm text-muted-foreground">µm</span>
                            </div>
                        </div>
                        <Slider className="mt-3 past:hidden [&amp;_[data-slot=slider-range]]:bg-spectrum-green [&amp;_[data-slot=slider-thumb]]:border-spectrum-green" step={1} value={self.MoveState.moves.stage.z.current} min={-100} max={100} onCommit={self.move_one(name: "stage.z", to: event.value)} />
                        <div className="mt-3 grid grid-cols-5 gap-1.5 past:hidden">
                            <Button size="sm" variant="outline" onClick={self.move_one(name: "stage.z", by: -50.0)}>-50</Button>
                            <Button size="sm" variant="outline" onClick={self.move_one(name: "stage.z", by: -5.0)}>-5</Button>
                            <Button size="sm" variant="secondary" onClick={self.move_one(name: "stage.z", to: 0.0)}>0</Button>
                            <Button size="sm" variant="outline" onClick={self.move_one(name: "stage.z", by: 5.0)}>+5</Button>
                            <Button size="sm" variant="outline" onClick={self.move_one(name: "stage.z", by: 50.0)}>+50</Button>
                        </div>
                        <span className="mt-2 block text-[11px] text-muted-foreground">Carries another plane into the sheet, just as sharp.</span>
                    </div>

                    <foreach items={self.DetectorState.detectors} let="camera" key={camera.name}>
                        <div className="rounded-2xl border border-border/60 bg-card/70 p-4 shadow-xl">
                            <div className="flex items-center justify-between gap-2">
                                <span className="text-[10px] font-medium uppercase tracking-[0.2em] text-muted-foreground">What {camera.name} delivers</span>
                            </div>
                            <div className="mt-2 flex gap-1.5">
                                <foreach items={camera.axes} let="dim" key={dim.name}>
                                    <div className={dim.size == null ? "flex min-w-0 flex-1 flex-col rounded-lg border border-spectrum-green/40 bg-spectrum-green/10 px-2 py-1.5" : "flex min-w-0 flex-1 flex-col rounded-lg bg-muted/40 px-2 py-1.5"}>
                                        <span className={dim.size == null ? "text-base font-semibold text-spectrum-green" : "text-base font-semibold"}>{dim.name}</span>
                                        <span className="truncate text-[10px] text-muted-foreground">{dim.size ?? "per stack"}</span>
                                    </div>
                                </foreach>
                            </div>
                            <span className="mt-2 block text-[11px] text-muted-foreground">Its frames step the sheet, so a stack is one sweep with nothing else moving.</span>
                            <div className="mt-3 grid grid-cols-2 gap-3 past:hidden">
                                <div className="flex min-w-0 flex-col gap-2 rounded-xl bg-muted/30 p-3">
                                    <span className="text-[10px] font-medium uppercase tracking-[0.2em] text-muted-foreground">Exposure</span>
                                    <div className="flex items-baseline gap-1">
                                        <span className="text-xl font-semibold tabular-nums">{fmt.number(value: self.TuneState.tunes.camera.exposure.current, digits: 0)}</span>
                                        <span className="text-xs text-muted-foreground">{self.TuneState.tunes.camera.exposure.unit}</span>
                                    </div>
                                    <Slider className="min-w-0" step={self.TuneState.tunes.camera.exposure.step} value={self.TuneState.tunes.camera.exposure.current} min={self.TuneState.tunes.camera.exposure.minimum} max={self.TuneState.tunes.camera.exposure.maximum} onCommit={self.tune(name: "camera.exposure", to: event.value)} />
                                </div>
                                <div className="flex min-w-0 flex-col gap-2 rounded-xl bg-muted/30 p-3">
                                    <span className="text-[10px] font-medium uppercase tracking-[0.2em] text-muted-foreground">Gain</span>
                                    <div className="flex items-baseline gap-1">
                                        <span className="text-xl font-semibold tabular-nums">{fmt.number(value: self.TuneState.tunes.camera.gain.current, digits: 1)}</span>
                                        <span className="text-xs text-muted-foreground">{self.TuneState.tunes.camera.gain.unit}</span>
                                    </div>
                                    <Slider className="min-w-0" step={self.TuneState.tunes.camera.gain.step} value={self.TuneState.tunes.camera.gain.current} min={self.TuneState.tunes.camera.gain.minimum} max={self.TuneState.tunes.camera.gain.maximum} onCommit={self.tune(name: "camera.gain", to: event.value)} />
                                </div>
                            </div>
                        </div>
                    </foreach>
                </div>
            </ScrollArea>

            <div className="relative min-w-0 flex-1 overflow-hidden rounded-2xl border border-border/60 bg-background shadow-2xl">
                <div className="h-full past:opacity-40">
                    <LiveView className="h-full" />
                </div>
                <div className="pointer-events-none absolute inset-x-0 top-9 flex flex-col gap-1 px-4">
                    <div className="h-1 w-full rounded-full bg-gradient-to-r from-spectrum-cyan/40 via-spectrum-cyan to-spectrum-cyan/40 shadow-[0_0_12px_1px] shadow-spectrum-cyan/40" />
                    <div className="flex items-center justify-between text-[10px] font-medium uppercase tracking-[0.2em] text-spectrum-cyan">
                        <span>Sheet</span>
                        <span>Waist</span>
                        <span>x</span>
                    </div>
                </div>
                <div className="absolute bottom-4 left-1/2 flex -translate-x-1/2 items-center gap-1 rounded-full border border-border/60 bg-card/80 p-1 shadow-xl backdrop-blur past:hidden">
                    <Button icon="play" size="sm" variant="ghost" className="rounded-full" onClick={self.start_live_view()}>Live</Button>
                    <Button icon="square" size="sm" variant="ghost" className="rounded-full" onClick={self.stop_live_view()}>Stop</Button>
                    <if when={!list.contains(value: list.pluck(value: obj.values(value: self.OpticsState.detectors), key: "calibrated"), item: true)}>
                        <Button icon="wand" size="sm" variant="ghost" className="rounded-full text-warning" onClick={self.calibrate_light_path()}>Calibrate</Button>
                    </if>
                    <Button icon="camera" size="sm" className="rounded-full bg-spectrum-cyan text-background hover:bg-spectrum-cyan/80" onClick={self.capture_image()}>Plane</Button>
                </div>
            </div>
        </div>
        </Blok>
    view-stack:
      description: 'Stack: sweep the sheet through the sample, stored in mikro.'
      bsx: |
        <Blok kind="agent" context="panel" catalog="newswitch">
        <div className="flex h-full w-full flex-col gap-3 overflow-auto bg-gradient-to-br from-spectrum-green/10 via-transparent to-spectrum-cyan/5 p-4">
            <foreach items={self.DetectorState.detectors} let="camera" key={camera.name}>
                <div className="rounded-2xl border border-spectrum-green/30 bg-card/70 p-4 shadow-xl">
                    <span className="text-[10px] font-medium uppercase tracking-[0.3em] text-spectrum-green">A stack is one sweep</span>
                    <div className="mt-2 flex flex-wrap gap-2">
                        <foreach items={camera.axes} let="dim" key={dim.name}>
                            <if when={dim.size == null}>
                                <div className="flex flex-col rounded-xl bg-spectrum-green/10 px-3 py-2">
                                    <span className="text-xl font-semibold tabular-nums text-spectrum-green">{dim.step} µm</span>
                                    <span className="text-[11px] text-muted-foreground">between planes, set by {dim.delivered_by}</span>
                                </div>
                            </if>
                        </foreach>
                    </div>
                    <span className="mt-2 block text-xs text-muted-foreground">The form spaces your planes by this for you, and locks its Step. Slices are offsets around the position, and nothing can run between planes.</span>
                </div>
            </foreach>
            <AcquisitionControl />
        </div>
        </Blok>
    view-stage:
      description: 'Stage: where the sample is, with the planes taken there.'
      file: ../views/stage.bsx
