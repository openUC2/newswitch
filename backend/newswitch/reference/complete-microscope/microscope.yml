# A microscope with every part and no bloks: what the frontend's hooks are generated from
# (`newswitch.tools.export_schemas`), and what the tests run on. Not a real one.
#
# After edits: just compile-reference

spec: newswitch/instrument/v0
name: complete-microscope

sample:
  fluorophore: {excitation: 488 nm, excitation_width: 20 nm, emission: 515 nm, emission_width: 25 nm, quantum_yield: 0.02}
  transmit: 0.9
  reflect: 0.001

cubes:
  laser-488:
    element: {kind: source, wavelength: 488 nm, width: 2 nm, max_power: 50 mW, coherent: true}
    tunes:
      power: {actuator: laser-dac, initial: 20.0, step: 1.0, units: mW}

  led-625:
    element: {kind: source, wavelength: 625 nm, width: 15 nm, max_power: 2 mW}
    tunes:
      power: {actuator: led-dac, initial: 0.0, step: 1.0, units: mW}

  stage:
    element: {kind: sample}
    moves:
      x: {actuator: stg-x, along: x, initial: 0.0, step: 10.0, min: -50000.0, max: 50000.0, speed: 50000.0, units: um}
      y: {actuator: stg-y, along: y, initial: 0.0, step: 10.0, min: -50000.0, max: 50000.0, speed: 50000.0, units: um}
      z: {actuator: stg-z, along: axis, initial: 0.0, step: 100.0, min: -5000.0, max: 5000.0, speed: 5000.0, units: um}

  objective:
    swaps:
      slot:
        actuator: turret
        initial: 1
        slots:
          1: {kind: lens, name: f20 NA 0.25, f: 20 mm, na: 0.25, working_distance: 10 mm}
          2: {kind: lens, name: f10 NA 0.4, f: 10 mm, na: 0.4, working_distance: 3 mm}

  dichroic:
    element: {kind: dichroic, cut: 500 nm}

  filter-wheel:
    swaps:
      slot:
        actuator: wheel
        initial: 1
        slots:
          1: {kind: filter, name: Open}
          2: {kind: filter, name: BP 525/50, center: 525 nm, width: 50 nm}

  tube:
    element: {kind: lens, f: 200 mm}

  camera:
    element:
      kind: sensor
      axes: {x: {size: 512, pitch: 6.5 um}, y: {size: 512, pitch: 6.5 um}}
    tunes:
      exposure: {initial: 100.0, step: 10.0, units: ms}
      gain: {initial: 0.0, step: 1.0, units: dB}
      binning: {initial: 1, step: 1}

illumination:
  - {from: laser-488, to: dichroic}
  - {from: dichroic, via: reflect, to: objective}
  - {from: objective, to: stage, side: epi}
  - {from: led-625, to: stage, side: transmitted}

detection:
  - {from: stage, to: objective, distance: focus}
  - {from: objective, to: dichroic, distance: 100 mm}
  - {from: dichroic, via: transmit, to: filter-wheel, distance: 30 mm}
  - {from: filter-wheel, to: tube, distance: 30 mm}
  - {from: tube, to: camera, distance: focus}

parts:
  stage: stage
  objective: {swap: objective.slot, reference_tube: 200 mm}
  filters: {swap: filter-wheel.slot}
  sources:
    1: {cube: laser-488, full_intensity: 100.0}
    2: {cube: led-625, full_intensity: 100.0}
  detectors:
    1: {cube: camera, frame_rate: 30 Hz}

settings:
  use_virtual_microscope: true
  db_path: arkitekt_agent.db
  image_dir: /tmp/newswitch/images
  cache_dir: /tmp/newswitch/cache
  camera_recording_dir: data/recordings
  camera_debug_window: false

# Having a board is what gives it the UC2 part; simulated, that is a virtual bus.
hardware:
  boards:
    uc2:
      transport: canopen
      interface: socketcan
      channel: can0
      steps_per_um_x: 3.2
      steps_per_um_y: 3.2
      steps_per_um_z: 3.2
      stage: {home_axes: [Z, X, Y]}
  actuators:
    stg-x: {board: uc2, axis: X}
    stg-y: {board: uc2, axis: Y}
    stg-z: {board: uc2, axis: Z}
    turret: {board: uc2, positions: {1: 0, 2: 20000}}
    wheel: {board: uc2, axis: A, positions: {1: 0.0, 2: 120.0}}
    laser-dac: {board: uc2, channel: 1, pwm_max: 1023}
    led-dac: {board: uc2, channel: 2, pwm_max: 1023}
  cameras:
    camera: {protocol: usb3-vision, vendor: Simulated, buffer_size: 8}
