# A microscope with every part and no bloks: what the frontend's hooks are generated from
# (`newswitch.infra.export_schemas`), and what the tests run on. Not a real one.
#

spec: newswitch/instrument/v0
name: complete-microscope

cubes:
  laser_488:
    element: {kind: source, emits: laser, spectrum: {center: 488 nm, width: 2 nm}, max_power: 50 mW}
    tunes:
      power: {actuator: laser-dac, initial: 20 mW, step: 1 mW, max: 50 mW}

  led_625:
    element: {kind: source, emits: led, spectrum: {center: 625 nm, width: 15 nm}, max_power: 50 nW}
    tunes:
      power: {actuator: led-dac, initial: 0 mW, step: 5 nW, max: 50 nW}

  stage:
    element:
      kind: sample
      simulation: gfp-beads
      simulations:   # what can be on it; simulation: says which is
        gfp-beads:
          fluorophore: egfp
          absorbed: 1.0e-4
          transmit: 0.9
          reflect: 1.0e-6
          pattern: {beads: 3600, radius: 2 um, depth: 4 um}
      # What it can be mounted on (the library in newswitch/instrument/holders), and where each
      # sits: its top left corner on the stage. Both are centred on the stage's 0.
      holders:
        slide: {holder: slide-75x25, mount: {x: -37.5 mm, y: -12.5 mm}}
        plate: {holder: plate-96, mount: {x: -63.88 mm, y: -42.74 mm}}
      mounted: slide
    moves:
      x: {actuator: stg-x, along: x, initial: 0 um, step: 10 um, min: -50000 um, max: 50000 um, speed: 50000 um/s}
      y: {actuator: stg-y, along: y, initial: 0 um, step: 10 um, min: -50000 um, max: 50000 um, speed: 50000 um/s}
      z: {actuator: stg-z, along: axis, initial: 0 um, step: 100 um, min: -5000 um, max: 5000 um, speed: 5000 um/s}

  objective:
    swaps:
      slot:
        actuator: turret
        initial: 1
        slots:
          1: {kind: lens, name: f20 NA 0.25, f: 20 mm, na: 0.25, immersion: air, magnification: 10, working_distance: 10 mm}
          2: {kind: lens, name: f10 NA 0.4, f: 10 mm, na: 0.4, immersion: air, magnification: 20, working_distance: 3 mm}

  dichroic:
    element: {kind: dichroic, curve: lp_500}

  filter_wheel:
    swaps:
      slot:
        actuator: wheel
        initial: 1
        slots:
          1: {kind: filter, name: Open}
          2: {kind: filter, name: BP 525/50, curve: bp_525_50}

  tube:
    element: {kind: lens, f: 200 mm}

  camera:
    element:
      kind: sensor
      axes: {x: {size: 512, pitch: 6.5 um}, y: {size: 512, pitch: 6.5 um}}
      readout: scmos
    tunes:
      frame_rate: {initial: 30 Hz, min: 1 Hz, max: 100 Hz, step: 1 Hz}
      exposure: {initial: 100 ms, step: 10 ms, min: 1 ms, max: 10 s}
      gain: {initial: 0 dB, step: 1 dB, min: 0 dB, max: 40 dB}
      binning: {initial: 1, min: 1, max: 4, step: 1}

illumination:
  - {from: laser_488, to: dichroic}
  - {from: dichroic, via: reflect, to: objective}
  - {from: objective, to: stage, side: epi, field: 500 um}
  - {from: led_625, to: stage, side: transmitted, field: 500 um}

detection:
  - {from: stage, to: objective, distance: focus}
  - {from: objective, to: dichroic, distance: 100 mm}
  - {from: dichroic, via: transmit, to: filter_wheel, distance: 30 mm}
  - {from: filter_wheel, to: tube, distance: 30 mm}
  - {from: tube, to: camera, distance: focus}

settings:
  simulate: everything
  db_path: arkitekt_agent.db
  image_dir: /tmp/newswitch/images
  cache_dir: /tmp/newswitch/cache
  camera_recording_dir: data/recordings
  camera_debug_window: false

# Having a board is what gives it the UC2 part; simulated, that is a virtual bus.
hardware:
  boards:
    uc2:
      transport: canopen
      interface: socketcan
      channel: can0
  actuators:
    stg-x: {driver: uc2.stepper, board: uc2, axis: X, steps_per_um: 3.2}
    stg-y: {driver: uc2.stepper, board: uc2, axis: Y, steps_per_um: 3.2}
    stg-z: {driver: uc2.stepper, board: uc2, axis: Z, steps_per_um: 3.2}
    turret: {driver: uc2.turret, board: uc2, positions: {1: 0, 2: 20000}}
    wheel: {driver: uc2.wheel, board: uc2, axis: A, positions: {1: 0.0, 2: 120.0}}
    laser-dac: {driver: uc2.laser, board: uc2, channel: 1, pwm_max: 1023}
    led-dac: {driver: uc2.laser, board: uc2, channel: 2, pwm_max: 1023}
  cameras:
    # uc2_cam_py's simulated camera, at the size its sensor is described with (its default is 1920 x 1200)
    camera: {protocol: usb3-vision, vendor: Simulated, buffer_size: 8, vendor_options: {sensor_width: 512, sensor_height: 512}}
