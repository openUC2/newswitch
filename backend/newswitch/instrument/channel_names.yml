# What a channel is called: inferred from the light path it takes, never declared.
#
# The code only measures what a channel's path does (newswitch/instrument/naming.py): the source's
# lines, the side its light lands on the sample from, whether it is scanned, how much of the
# source's own light the detection path lets through, the band that path passes, and what the
# detector is. Everything that makes that a name is here: change it, and every channel of every
# instrument is named anew.
#
# Placeholders, in a rule's name and in `describe`:
#   {dye}           the first of `dyes` whose windows hold an excitation line and the band, else `dye_otherwise`
#   {excitation}    the source's lines, 488 or 405/488; a broad source reads as `broad`
#   {excitation_nm} the same in nm, and nothing for a broad source
#   {emission}      where the band is: its middle (525), or >500 / <600 where it is open on one side
#   {band}, {band_nm}  the band from edge to edge (500–550), or >500 / <600
#   {source} {detector} {sample} {emits} {side}
# A placeholder with nothing to say leaves no dangling "/" or "·" behind.

spectrum: {from: 300 nm, to: 1100 nm}   # where a path's band is looked for
broad_above: 100 nm                     # a source line wider than this is no one wavelength...
broad: white                            # ...and reads as this in {excitation}
round_to: 5 nm                          # what a band's numbers are rounded to
blocked_below: 0.01                     # the share of the source's own light the detection path
                                        # passes, below which what arrives was emitted

# How the path makes its image: the first rule whose `when` all hold names the channel.
# `when` may say: emitted, side (epi, transmitted, orthogonal), scanned, timed (it times its
# photons), colors (a color sensor), emits (laser, led, lamp), broad.
rules:
  - {when: {emitted: true, side: orthogonal}, name: "Light-sheet {dye} · {excitation}/{emission}"}
  - {when: {emitted: true, timed: true}, name: "FLIM {dye} · {excitation}/{emission}"}
  - {when: {emitted: true, scanned: true}, name: "Confocal {dye} · {excitation}/{emission}"}
  - {when: {emitted: true}, name: "{dye} · {excitation}/{emission}"}
  - {when: {side: transmitted, colors: true}, name: "Brightfield RGB"}
  - {when: {side: transmitted}, name: "Brightfield {excitation}"}
  - {when: {side: epi}, name: "Reflection {excitation}"}
  - {name: "{source} · {detector}"}   # nothing above held

# Dyes, by where they are excited and where they emit: a name a microscopist knows the channel by.
# They also decide which channels of emitted light there are (compiler.reach): a source excites a
# dye here, and the way to a detector lets through its emission. A pair matching none has no channel.
dyes:
  - {name: DAPI, excitation: [340 nm, 410 nm], emission: [420 nm, 490 nm]}
  - {name: GFP, excitation: [460 nm, 505 nm], emission: [495 nm, 560 nm]}
  - {name: YFP, excitation: [505 nm, 530 nm], emission: [520 nm, 570 nm]}
  - {name: mCherry, excitation: [540 nm, 600 nm], emission: [590 nm, 660 nm]}
  - {name: Cy5, excitation: [610 nm, 660 nm], emission: [650 nm, 720 nm]}
  - {name: Cy7, excitation: [700 nm, 760 nm], emission: [760 nm, 840 nm]}
dye_otherwise: Fluorescence

# Channels that end up with one name: add these, in order, until they differ. The source last:
# two lights alike (a white LED and a white ring) are two channels, of two names.
apart_by: [detector, sample, swaps, source]

# The whole of what a path does, as a channel's description reads.
describe: "{source} {excitation_nm} · {side} · {band_nm} · {detector} · {sample}"
