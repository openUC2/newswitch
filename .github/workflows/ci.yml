name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The backend syncs leave out the extra "camera": building uc2_cam_py needs the MVS SDK
# (/opt/MVS), which the runners do not have. Its tests skip without it.

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras --no-extra camera --dev
      - run: uv run pytest -k "not integration"

  backend-coverage:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          python-version: "3.12"
      - run: uv sync --all-extras --no-extra camera --dev

      # Lint/format only need one platform, so they live here rather than in the OS matrix.
      - run: uv run ruff check .
      - run: uv run ruff format --check .

      - run: uv run pytest --cov --cov-branch --cov-report=xml
      - uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          working-directory: backend

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile

      # Blocking. Both gates used to be dead - `types` pointed at a solution tsconfig with
      # `files: []` so it checked ZERO files, and no CI ever ran eslint - which hid 165 type
      # errors and 90 lint problems. The backlog is cleared; keep it that way.
      - run: yarn prettier --check "src/**/*.{ts,tsx,css}" "plugins/**/*.ts"
      - run: yarn lint
      - run: yarn types

      - run: yarn test

      # The vite plugin generates src/apps/default/** from the committed schema export
      # (frontend/schemas/, no backend needed); a missing export fails the build.
      - run: yarn build

  e2e:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - uses: extractions/setup-just@v3

      - run: uv sync --all-extras --no-extra camera --dev
        working-directory: backend
      - run: yarn install --frozen-lockfile
      - run: yarn playwright install --with-deps chromium
      - run: yarn e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # The frontend's typed hooks are GENERATED from the schemas of a complete microscope,
  # which the backend exports into frontend/schemas/ (what a running backend registers
  # depends on its device configuration, so the hooks are not generated from one). This
  # job re-exports, regenerates, and fails if either result differs from what is
  # committed. It only works because both halves live in one repo at one commit.
  codegen-drift:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - run: uv sync --all-extras --no-extra camera --dev
        working-directory: backend
      - run: yarn install --frozen-lockfile
        working-directory: frontend

      - name: Export the schemas of the complete microscope
        run: uv run python -m newswitch.tools.export_schemas
        working-directory: backend

      - name: Regenerate
        run: yarn build
        working-directory: frontend

      - name: Fail if the committed export or codegen is stale
        run: |
          paths="frontend/schemas frontend/src/apps"
          if ! git diff --quiet -- $paths; then
            echo "::error::The schema export or the generated frontend code is stale: run just drift-check locally and commit the result."
            git diff --stat -- $paths
            git diff -- $paths | head -100
            exit 1
          fi
          echo "Schema export and generated code match the backend."

  ci-ok:
    # One required status check that still passes when path filters skip a job
    if: always()
    needs: [backend-test, backend-coverage, frontend, e2e, codegen-drift]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job failed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "job results: $results"
          case "$results" in
            *failure*|*cancelled*) exit 1 ;;
          esac
