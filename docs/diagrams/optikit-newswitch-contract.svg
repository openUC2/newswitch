<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" font-family="Helvetica,Arial,sans-serif" font-size="13">
  <style>
    .box{fill:#fff;stroke:#334155;stroke-width:1.5;rx:8}
    .t{font-weight:bold;fill:#0f172a}
    .s{fill:#475569}
    .arrow{stroke:#0e7490;stroke-width:2;fill:none;marker-end:url(#a)}
    .back{stroke:#9333ea;stroke-width:2;fill:none;marker-end:url(#b)}
    .lbl{fill:#0e7490;font-size:12}
    .lblb{fill:#9333ea;font-size:12}
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0e7490"/></marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#9333ea"/></marker>
  </defs>
  <rect width="980" height="460" fill="#f8fafc"/>

  <!-- newswitch runtime -->
  <rect class="box" x="640" y="40" width="300" height="180" rx="8"/>
  <text class="t" x="660" y="66">NewSwitch (on the Pi)</text>
  <text class="s" x="660" y="90">• owns dynamic state: positions, calibration,</text>
  <text class="s" x="675" y="107">user settings — never in the DSN</text>
  <text class="s" x="660" y="130">• driver manifest  GET /system/drivers</text>
  <text class="s" x="675" y="147">(uc2.stage over CANopen / UC2-REST)</text>
  <text class="s" x="660" y="170">• loads newswitch-config once at startup</text>
  <text class="s" x="660" y="193">• queries DSN only hypothetically (stateless)</text>

  <!-- optikit CAD -->
  <rect class="box" x="40" y="40" width="300" height="180" rx="8"/>
  <text class="t" x="60" y="66">Optikit CAD platform</text>
  <text class="s" x="60" y="90">• bindings wizard: match a DOF</text>
  <text class="s" x="75" y="107">(dz, tilt_x…) to a manifest driver</text>
  <text class="s" x="60" y="130">• DofSpec.actuation = firmware</text>
  <text class="s" x="60" y="153">• config components emit fragments;</text>
  <text class="s" x="75" y="170">assembler merges them (no ifs/loops)</text>
  <text class="s" x="60" y="193">• DRC: range / resolution vs. driver</text>

  <!-- DSN -->
  <rect class="box" x="360" y="260" width="280" height="160" rx="8"/>
  <text class="t" x="380" y="286">.dsn — the versioned contract</text>
  <text class="s" x="380" y="310">• static design only, stateless</text>
  <text class="s" x="380" y="333">• input variables (z-pos, laser-state)</text>
  <text class="s" x="395" y="350">declared, never assigned</text>
  <text class="s" x="380" y="373">• output: newswitch-config (structured)</text>
  <text class="s" x="380" y="396">• per-device *.newswitch-device.yml</text>

  <!-- arrows -->
  <path class="back" d="M640,110 L340,110"/>
  <text class="lblb" x="380" y="100">1. driver manifest (contract v1)</text>

  <path class="arrow" d="M240,220 L420,260"/>
  <text class="lbl" x="150" y="245">2. binding + config fragments → export</text>

  <path class="arrow" d="M640,330 C740,330 790,280 790,220"/>
  <text class="lbl" x="660" y="352">3. static config at startup</text>

  <path class="back" d="M760,240 C720,290 680,300 645,305"/>
  <text class="lblb" x="700" y="262" text-anchor="start"> </text>
  <text class="lblb" x="655" y="290">4. "if z = 50 mm, where is</text>
  <text class="lblb" x="668" y="306">the objective?" (query API)</text>
</svg>
